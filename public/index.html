<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pool à vie">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192-v2.png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v2.png">
<title>Pool à vie</title>
<style>
  :root{
    --ice:#0b1622; --panel:#121f2e; --panel-2:#182838; --line:#233648;
    --text:#dfe9f2; --dim:#8ea3b8; --gold:#c9a24b; --red:#e07466; --green:#5ba088;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  [hidden]{display:none !important;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--ice);color:var(--text);}
  body{min-height:100vh;padding-bottom:calc(64px + var(--safe-b));overscroll-behavior-y:none;}
  .top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0e1a28,#0b1622);border-bottom:1px solid var(--line);
       padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .brand{display:flex;align-items:center;gap:8px;min-width:0;}
  .brand .logo{width:34px;height:34px;flex:none;display:block;}
  /* Application ouverte depuis l'écran d'accueil : un peu d'air sous la barre d'état (effet de flou d'iOS). */
  @media (display-mode: standalone){ .top{padding-top:calc(16px + var(--safe-t));} }
  .brand h1{font-size:15px;letter-spacing:.05em;margin:0;font-weight:800;}
  .brand .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top .me{font-size:12px;color:var(--dim);text-align:right;white-space:nowrap;}
  .top .me b{color:var(--gold);}
  .bell{position:relative;font-size:22px;text-decoration:none;line-height:1;}
  .bell .badge{position:absolute;top:-6px;right:-10px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px;line-height:14px;}
  #banners{position:fixed;left:0;right:0;top:calc(8px + var(--safe-t));z-index:70;display:flex;flex-direction:column;gap:8px;padding:0 10px;pointer-events:none;}
  .banner{pointer-events:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.45);
          display:flex;gap:10px;align-items:flex-start;cursor:pointer;animation:slidein .35s ease;max-width:560px;margin:0 auto;width:100%;}
  .banner .ico{font-size:24px;line-height:1;}
  .banner .tt{font-weight:800;font-size:15px;} .banner .bd{font-size:13px;color:var(--dim);margin-top:2px;}
  .banner .x{margin-left:auto;color:var(--dim);font-size:18px;padding:0 0 0 8px;}
  .banner.alarm{background:linear-gradient(135deg,#b3121f,#6d0a12);border-color:#ff5a5a;animation:slidein .35s ease, shake .5s .35s 3, flash 1s .35s 6;}
  .banner.alarm .tt{color:#fff;font-size:17px;letter-spacing:.02em;} .banner.alarm .bd{color:#ffd9d9;}
  .banner.alarm .ico{font-size:34px;animation:siren .6s linear infinite;}
  @keyframes slidein{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes flash{50%{box-shadow:0 0 0 4px rgba(255,80,80,.8),0 8px 24px rgba(0,0,0,.45)}}
  @keyframes siren{0%{transform:rotate(-14deg) scale(1)}50%{transform:rotate(14deg) scale(1.15)}100%{transform:rotate(-14deg) scale(1)}}
  .notif{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid #1a2938;cursor:pointer;}
  .notif.new{background:#141d2c;border-radius:8px;} .notif .ico{font-size:22px;width:28px;text-align:center;}
  main{padding:14px 16px;max-width:860px;margin:0 auto;}
  h2.title{font-size:20px;margin:4px 0 12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .card h3{font-size:12px;color:var(--dim);margin:0 0 10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px;}
  input,select,textarea{background:var(--ice);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;font-size:16px;width:100%;font-family:inherit;}
  textarea{font-family:ui-monospace,monospace;font-size:13px;min-height:140px;}
  label.f{display:block;font-size:12px;color:var(--dim);margin:0 0 4px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .row > *{flex:1;min-width:120px;}
  button{font-family:inherit;}
  .btn{background:var(--gold);color:#1a1408;border:none;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;}
  .btn.danger{background:transparent;border:1px solid var(--red);color:var(--red);}
  .btn.small{padding:7px 10px;font-size:13px;border-radius:8px;}
  .btn:disabled{opacity:.5;}
  .seg{display:flex;background:var(--ice);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px;}
  .seg button{flex:1;background:transparent;border:none;color:var(--dim);padding:8px 4px;border-radius:7px;font-size:13px;font-weight:600;}
  .seg button.on{background:var(--panel-2);color:var(--text);}
  .list{display:flex;flex-direction:column;}
  .item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #1a2938;cursor:pointer;}
  .item:last-child{border-bottom:none;}
  .item .grow{flex:1;min-width:0;}
  .item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .meta{font-size:12px;color:var(--dim);margin-top:2px;}
  .item .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .item .num b{font-size:17px;}
  .item.taken{opacity:.45;}
  .item.out .name{color:var(--dim);font-weight:500;}
  .rank{width:26px;height:26px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;}
  .rank.po{background:#2b2512;color:var(--gold);}
  .cutline{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;padding:6px 0;border-bottom:1px dashed var(--gold);margin-bottom:2px;}
  .pos{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;flex:none;}
  .pos-F{background:#2a3f2f;color:#8fd6a4;} .pos-D{background:#2a333f;color:#8fb4d6;} .pos-G{background:#3f2a2a;color:#d68f8f;}
  .aav{color:var(--gold);font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--dim);margin-left:4px;vertical-align:1px;}
  .tag.pts{border-color:var(--green);color:var(--green);} .tag.cap{border-color:var(--gold);color:var(--gold);}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;}
  .stat .l{font-size:11px;color:var(--dim);}
  .stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 2px;}
  .bar i{display:block;height:100%;background:var(--green);} .bar i.over{background:var(--red);}
  .issues{background:#2a1716;border:1px solid #5a2a26;color:#f0b3aa;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
  .okbox{background:#13261f;border:1px solid #24493b;color:#9fd8bf;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
  .muted{color:var(--dim);font-size:13px;}
  .empty{color:var(--dim);font-size:14px;padding:24px 8px;text-align:center;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(14,26,40,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);
          display:flex;padding-bottom:var(--safe-b);}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;color:var(--dim);text-decoration:none;font-size:10px;font-weight:600;position:relative;}
  .tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px;line-height:14px;}
  .tabbar a.on{color:var(--gold);}
  .tabbar svg{width:22px;height:22px;}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;
         border:1px solid var(--line);max-height:88vh;overflow:auto;padding:8px 16px calc(18px + var(--safe-b));transform:translateY(105%);transition:transform .22s,visibility .22s;visibility:hidden;}
  .sheet.open{transform:none;visibility:visible;} .sheet-bg.open{display:block;}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px;}
  .sheet h3{margin:0 0 4px;font-size:19px;}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0;}
  .kv div{background:var(--ice);border-radius:10px;padding:8px;text-align:center;}
  .kv .l{font-size:10px;color:var(--dim);text-transform:uppercase;} .kv .v{font-weight:800;font-size:16px;margin-top:2px;}
  .toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--gold);
         padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw;}
  .toast.show{opacity:1;}
  .code{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:.15em;color:var(--gold);font-weight:800;}
  .login{max-width:380px;margin:8vh auto 0;}
  .login .logo{width:168px;height:168px;display:block;margin:0 auto 10px;}
  details summary{cursor:pointer;color:var(--dim);font-size:13px;}
  .pick{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1a2938;font-size:14px;}
  .pick input{width:20px;height:20px;flex:none;}
  a.link{color:var(--gold);text-decoration:none;font-weight:600;}
  .post{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .post.auto{border-color:#5a2a26;background:linear-gradient(180deg,#2a1716,var(--panel));}
  .post .who{font-weight:800;font-size:14px;} .post .when{color:var(--dim);font-size:11px;margin-left:6px;font-weight:500;}
  .post .txt{white-space:pre-wrap;margin:6px 0 8px;font-size:15px;line-height:1.35;}
  .rx{display:flex;gap:6px;flex-wrap:wrap;} .rx button{background:var(--ice);border:1px solid var(--line);border-radius:20px;padding:4px 9px;font-size:14px;color:var(--text);}
  .rx button.on{border-color:var(--gold);background:#2b2512;} .rx button b{font-size:12px;margin-left:3px;}
  .medal{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #1a2938;} .medal .m{font-size:24px;width:30px;text-align:center;}
  .tag.rk{border-color:#7fc8a9;color:#9fe0c2;background:#13261f;} .tag.rk2{border-color:#8fb4d6;color:#b5d3ee;background:#16233a;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--ice);font-variant-numeric:tabular-nums;}
  .chip.acq{border-color:var(--green);color:#9fd8bf;} .chip.used{opacity:.4;text-decoration:line-through;}
  .chip.sel{border-color:var(--gold);background:#2b2512;color:var(--gold);font-weight:700;}
  .tray{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .tray .side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:96px;}
  .tray .side h4{margin:0 0 6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;}
  .tray .it{font-size:13px;padding:4px 0;border-bottom:1px solid #1a2938;display:flex;justify-content:space-between;gap:6px;cursor:pointer;}
  .tray .it:last-child{border-bottom:none;}
  .tray .it span:last-child{color:var(--dim);white-space:nowrap;}
  .impact{font-size:12px;border-radius:10px;padding:8px 10px;margin-bottom:8px;}
  .trade{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel);}
  .trade .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-weight:700;}
  .pill{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;}
  .pill.wait{border-color:var(--gold);color:var(--gold);} .pill.ok{border-color:var(--green);color:var(--green);} .pill.no{border-color:var(--red);color:var(--red);}
  .trade .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;}
  .trade .cols h5{margin:0 0 4px;font-size:11px;color:var(--dim);font-weight:600;}
  .trade .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .boardwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:0 -4px 12px;}
  table.db{border-collapse:separate;border-spacing:0;font-size:11px;}
  table.db th,table.db td{border-right:1px solid #1a2938;border-bottom:1px solid #1a2938;padding:6px;vertical-align:top;}
  table.db thead th{position:sticky;top:0;background:#0e1a28;z-index:2;color:var(--dim);font-weight:700;min-width:96px;max-width:110px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  table.db th.r{position:sticky;left:0;background:#0e1a28;z-index:1;color:var(--gold);min-width:34px;text-align:center;}
  table.db thead th.r{z-index:3;}
  table.db td{min-width:96px;max-width:110px;height:46px;}
  table.db td b{display:block;color:var(--text);font-size:12px;line-height:1.2;}
  table.db td small{display:block;color:var(--dim);}
  table.db td .own{display:inline-block;margin-top:2px;padding:1px 5px;border-radius:5px;background:#13261f;color:#9fd8bf;font-weight:700;}
  table.db td.mine{background:#141d2c;} table.db td.cur{background:#2b2512;box-shadow:inset 0 0 0 2px var(--gold);}
  table.db td.gone{opacity:.5;}
  .clock{background:#2b2512;border:1px solid var(--gold);border-radius:12px;padding:12px;margin-bottom:12px;}
  .lot{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1a2938;font-size:15px;}
  .lot .n{width:38px;height:38px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold);flex:none;}
  .lot.reveal{animation:pop .5s ease;} @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
  .datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .datebar input{flex:1;text-align:center;padding:9px;}
  .games{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none;}
  .game{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;min-width:96px;font-variant-numeric:tabular-nums;}
  .game .t{display:flex;justify-content:space-between;gap:10px;font-weight:700;}
  .game .s{color:var(--dim);font-size:11px;margin-top:3px;}
  .game.live{border-color:var(--red);} .game.live .s{color:var(--red);font-weight:700;}
  .lt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
  .lt th{font-size:10px;color:var(--dim);font-weight:700;text-transform:uppercase;padding:6px 3px;text-align:right;}
  .lt th.grp{text-align:center;color:var(--gold);letter-spacing:.06em;border-bottom:1px dashed var(--gold);}
  .lt td{padding:10px 3px;text-align:right;border-top:1px solid #1a2938;}
  .lt td.n,.lt th.n{text-align:left;}
  .lt td.n{font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lt td.hot{background:#2b2512;color:var(--gold);font-weight:800;}
  .lt tr.me td.n{color:var(--gold);}
  .lt tr.lrow{cursor:pointer;}
  .lt tr.detail td{padding:0 3px 10px;text-align:left;border-top:none;}
  .lt .sep{border-left:1px solid var(--line);}
  .pl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:3px 0 3px 8px;}
  .pl b{color:var(--text);}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:4px;animation:pulse 1.4s infinite;}
  @keyframes pulse{50%{opacity:.25}}
#wake{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:var(--ice);color:var(--text,#fff)}
#wake img{width:96px;height:96px}#wake b{font-size:18px}#wake span{opacity:.75;font-size:14px;max-width:300px}
#wake i{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:wk 1s linear infinite}
@keyframes wk{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="top" id="top" hidden>
  <div class="brand"><img class="logo" src="/logo-mark.svg" alt=""><div><h1>POOL À VIE</h1><div class="sub" id="updated">—</div></div></div>
  <div style="display:flex;align-items:center;gap:12px">
    <a class="bell" href="#/notifications" aria-label="Notifications">🔔<span class="badge" id="bellBadge" hidden></span></a>
    <div class="me" id="meLabel"></div>
  </div>
</header>

<main id="view"></main>

<nav class="tabbar" id="tabbar" hidden>
  <a href="#/classement" data-r="classement"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Classement</a>
  <a href="#/mon-equipe" data-r="mon-equipe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg>Mon équipe</a>
  <a href="#/repechage" data-r="repechage" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></svg>Repêchage</a>
  <a href="#/direct" data-r="direct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>En direct</a>
  <a href="#/echanges" data-r="echanges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>Échanges<span class="badge" id="tradeBadge" hidden></span></a>
  <a href="#/joueurs" data-r="joueurs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Joueurs</a>
  <a href="#/plus" data-r="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Plus<span class="badge" id="plusBadge" hidden>!</span></a>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<div id="banners"></div>

<script>
const POS_LABEL = { F: 'Attaquants', D: 'Défenseurs', G: 'Gardiens' };
let S = null;            // état de la ligue (/api/state)
let teamsCache = [];     // pour la page de connexion

// ---------- utilitaires ----------
const $ = sel => document.querySelector(sel);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ if (n === null || n === undefined) return '—'; return (n/1e6).toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:3}) + ' M$'; }
function moneyFull(n){ return Math.round(n).toLocaleString('fr-CA') + ' $'; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function ago(iso){
  if (!iso) return 'jamais';
  const m = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if (m < 1) return 'à l\'instant'; if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m/60); if (h < 24) return `il y a ${h} h`;
  return new Date(iso).toLocaleDateString('fr-CA');
}
function ppg(t){ return t.ppg.toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function statLine(p){
  if (p.pos === 'G') return `${p.gp} PJ · ${p.wins} V · ${p.ot_losses} DP · ${p.shutouts} BL`;
  return `${p.gp} PJ · ${p.goals} B · ${p.assists} A`;
}
// Le serveur gratuit s'endort après un moment sans visite. Pendant son réveil, Render répond par sa
// propre page d'attente (pas du JSON) : on affiche un écran d'attente et on réessaie tout seul.
async function pfetch(path, opts = {}){
  const start = Date.now();
  for (let i = 0; ; i++) {
    let res = null;
    try { res = await fetch(path, opts); } catch (e) { if (opts.method && opts.method !== 'GET') throw e; }
    if (res && res.headers.get('X-Pool-App')) { wakeScreen(false); return res; }
    if (Date.now() - start > 120000) { wakeScreen(false); throw new Error('Le serveur ne répond pas. Réessaie dans une minute.'); }
    if (i === 0) wakeScreen(true);
    await new Promise(r => setTimeout(r, 2500));
  }
}
function wakeScreen(on){
  let el = document.getElementById('wake');
  if (!on) { if (el) el.remove(); return; }
  if (el) return;
  el = document.createElement('div'); el.id = 'wake';
  el.innerHTML = `<img src="/logo.svg" alt=""><b>Réveil du serveur…</b><span>Le serveur gratuit faisait la sieste. Ça prend environ 30 secondes, une seule fois.</span><i></i>`;
  document.body.appendChild(el);
}
async function api(path, body){
  const opts = body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) };
  const res = await pfetch(path, opts);
  if (res.status === 401 && !path.startsWith('/api/login')) {
    if (S) { S = null; showLogin(); }
    throw new Error('Connexion requise (session non conservée)');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
  return data;
}
async function apiDelete(path){
  const res = await fetch(path, { method:'DELETE' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
  return data;
}
function run(fn){ return async (...a) => { try { await fn(...a); } catch(e){ toast(e.message); } }; }
const team = id => S.teams.find(t => t.id === Number(id));
const myTeam = () => S && team(S.me.teamId);

// ---------- connexion ----------
async function showLogin(){
  $('#top').hidden = true; $('#tabbar').hidden = true;
  let loadError = '';
  teamsCache = await pfetch('/api/login/teams').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(e => { loadError = e.message; return []; });
  const saved = localStorageGet('pav_team');
  $('#view').innerHTML = `
    <div class="login">
      <img class="logo" src="/logo.svg" alt="Pool à vie">
      <h2 class="title" style="text-align:center">Pool à vie</h2>
      <div class="card">
        <label class="f">Mon équipe</label>
        <select id="lgTeam">${teamsCache.map(t => `<option value="${t.id}" ${String(t.id)===saved?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
        <div style="height:10px"></div>
        <label class="f">Code d'accès</label>
        <input id="lgCode" autocomplete="current-password" autocapitalize="characters" placeholder="ex. K7PM2Q">
        <div style="height:14px"></div>
        <button class="btn" style="width:100%" id="lgGo">Entrer</button>
        <p id="lgErr" class="muted" style="color:var(--red);margin:10px 0 0" hidden></p>
        ${loadError ? `<p class="muted" style="color:var(--red)">Le serveur ne répond pas (${esc(loadError)}). Réessaie dans 30 secondes.</p>`
          : teamsCache.length ? '' : '<p class="muted">Aucune équipe n\'a encore de code. Le commissaire doit définir COMMISSAIRE_CODE dans Render.</p>'}
      </div>
      <p class="muted" style="text-align:center">Ton code t'est remis par le commissaire.</p>
    </div>`;
  // Les erreurs restent affichées sous le bouton (un message éphémère passe trop vite sur téléphone).
  const showErr = msg => { const e = $('#lgErr'); if (e) { e.textContent = msg; e.hidden = !msg; } };
  const go = async () => {
    showErr(''); $('#lgGo').disabled = true; $('#lgGo').textContent = 'Connexion…';
    try {
      const v = $('#lgTeam').value, teamId = v === 'admin' ? 'admin' : Number(v);
      await api('/api/login', { teamId, code: $('#lgCode').value });
      localStorageSet('pav_team', String(teamId));
      try { await loadState(); startNotifications(); }
      catch (e) { throw new Error(`Connecté, mais le chargement a échoué : ${e.message}. Si ça se répète, les témoins (cookies) sont peut-être bloqués dans ce navigateur.`); }
      route();
    } catch (e) {
      showErr(e.message);
      $('#lgGo').disabled = false; $('#lgGo').textContent = 'Entrer';
    }
  };
  $('#lgGo').onclick = go;
  $('#lgCode').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function localStorageGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v){ try { localStorage.setItem(k, v); } catch {} }

async function loadState(){ S = await api('/api/state'); renderChrome(); }
function renderChrome(){
  $('#top').hidden = false; $('#tabbar').hidden = false;
  const lastStats = [S.config.lastUpdate, S.config.lastLive].filter(Boolean).sort().pop();
  $('#updated').textContent = `Stats LNH : ${ago(lastStats)}`;
  $('#meLabel').innerHTML = `<b>${esc(S.me.name)}</b>${S.me.isAdmin ? '<br>commissaire' : ''}`;
  const b = $('#tradeBadge'); b.hidden = !S.pendingTrades; b.textContent = S.pendingTrades || '';
  $('#plusBadge').hidden = !S.pendingProtection;
  const bb = $('#bellBadge'); bb.hidden = !S.unreadNotifications; bb.textContent = S.unreadNotifications > 99 ? '99+' : (S.unreadNotifications || '');
  // Pendant le repêchage (en cours), l'onglet Repêchage remplace En direct ; sinon il reste dans Plus.
  const drafting = S.draft && S.draft.status === 'live';
  document.querySelector('.tabbar a[data-r="repechage"]').hidden = !drafting;
  document.querySelector('.tabbar a[data-r="direct"]').hidden = !!drafting;
}
async function boot(){
  try { await loadState(); } catch { showLogin(); return; }
  startNotifications();
  route();
}

// ---------- routage ----------
window.addEventListener('hashchange', () => route());
function route(){
  if (!S) return;
  closeSheet();
  const [, r = 'classement', arg] = location.hash.split('/');
  document.querySelectorAll('.tabbar a').forEach(a => a.classList.toggle('on', a.dataset.r === r ||
    (r === 'equipe' && a.dataset.r === (Number(arg) === S.me.teamId ? 'mon-equipe' : 'classement')) ||
    (['liste','historique','commissaire','equipes','protection','projections','projection','mur','trophees','temple'].includes(r) && a.dataset.r === 'plus') ||
    (['offre','choix','echange'].includes(r) && a.dataset.r === 'echanges')));
  clearInterval(liveTimer); liveTimer = null; clearInterval(draftTimer); draftTimer = null;
  window.scrollTo(0, 0);
  const views = { classement: vStandings, 'mon-equipe': () => vTeam(S.me.teamId), equipe: () => vTeam(arg), equipes: vTeams, direct: () => vLive(arg),
                  repechage: () => vDraft(arg), protection: () => vProtection(arg), echanges: vTrades, echange: () => vTradeOne(arg), mur: vWall, trophees: vAwards, temple: vHall, projections: vProjections, projection: () => vProjection(arg), notifications: vNotifications, offre: () => vOffer(arg), choix: () => vPicks(arg),
                  joueurs: vPlayers, plus: vMore, liste: vWatchlist, historique: vMoves, commissaire: vAdmin };
  (views[r] || vStandings)();
}
async function refresh(){ await loadState(); route(); }

function formIcon(p){ const f = p.trend && p.trend.form; return f === 'hot' ? '<span title="En feu : 5 points ou plus à ses 5 derniers matchs">🔥 </span>' : f === 'cold' ? '<span title="Froid : aucun point à ses 5 derniers matchs">🧊 </span>' : ''; }
// Petit graphique des 10 derniers matchs (points de pool par match).
function formChart(games){
  if (!games || !games.length) return '';
  const max = Math.max(3, ...games.map(g => g.pts));
  return `<div style="display:flex;align-items:flex-end;gap:4px;height:56px;margin:8px 0 2px">${games.map(g => `<div title="${g.date} : ${g.pts} pt(s)" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%">
    <div style="width:100%;border-radius:4px 4px 0 0;background:${g.pts ? 'var(--gold)' : 'var(--line)'};height:${g.pts ? Math.max(14, g.pts / max * 100) : 6}%"></div></div>`).join('')}</div>
    <div style="display:flex;gap:4px;font-size:10px;color:var(--dim)">${games.map(g => `<div style="flex:1;text-align:center">${g.pts}</div>`).join('')}</div>`;
}
// Recrue (art. 4.3.1), recrue de 2e année (4.3.3) : protection automatique possible ⚡.
function rookieTags(p){
  const c = p.cats || [];
  return (c.includes('R') ? '<span class="tag rk" title="Recrue LNH cette saison : protection automatique possible (art. 4.3.1)">🍼 Recrue ⚡</span>' : '')
    + (c.includes('R2') ? '<span class="tag rk2" title="Recrue la saison passée : une année de protection supplémentaire (art. 4.3.3)">Recrue 2e an ⚡</span>' : '')
    + (c.includes('GP') ? '<span class="tag" title="Peu de matchs : protection automatique possible (art. 4.3.2)">≤ 39 PJ ⚡</span>' : '')
    + (!c.length && p.rookie ? '<span class="tag rk">🍼 Recrue</span>' : '');
}
function playerItem(p, { showFlags = false, showOwner = false } = {}){
  const flags = showFlags ? `${p.counts_points ? '<span class="tag pts">PTS</span>' : ''}${p.counts_cap ? '<span class="tag cap">$</span>' : ''}` : '';
  const owner = showOwner ? (p.team ? ` · <b>${esc(p.team)}</b>` : ' · <span style="color:var(--green)">disponible</span>') : '';
  const link = p.nhl_id ? '' : ' · <span style="color:var(--red)">sans fiche LNH</span>';
  return `<div class="item ${showFlags && !p.counts_points ? 'out' : ''}" onclick="openPlayer(${p.id})">
    <span class="pos pos-${p.pos}">${p.pos}</span>
    <div class="grow"><div class="name">${formIcon(p)}${esc(p.name)}${flags}${p.retained ? '<span class="tag" title="Une autre équipe retient une partie du salaire">ret.</span>' : ''}</div>
      ${rookieTags(p) ? `<div class="meta" style="margin-top:3px">${rookieTags(p).replace(/class="tag/g, 'style="margin-left:0;margin-right:4px" class="tag')}</div>` : ''}
      <div class="meta">${esc(p.nhl_team || '—')}${p.age ? ' · ' + p.age + ' ans' : ''} · ${statLine(p)}${owner}${link}</div></div>
    <div class="num"><b>${p.pts}</b><div class="meta aav">${money(p.aav)}</div></div>
  </div>`;
}

// ---------- Fiche joueur ----------
let sheetPlayer = null;
async function openPlayer(id){
  sheetPlayer = await api(`/api/players/${id}`);
  renderSheet();
}
function findPlayer(id){
  for (const t of S.teams) for (const pos of ['F','D','G']) {
    const p = t.positions[pos].players.find(x => x.id === id);
    if (p) return { ...p, team: t.name, team_id: t.id };
  }
  return null;
}
function renderSheet(){
  const p = sheetPlayer;
  const owner = p.team_id ? team(p.team_id) : null;
  const goalie = p.pos === 'G';
  const kv = goalie
    ? [['PJ',p.gp],['V',p.wins],['DP',p.ot_losses],['BL',p.shutouts]]

function fmtDate(iso){ return new Date(iso).toLocaleString('fr-CA', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }
function timeLeft(iso){
  const m = Math.max(0, Math.round((new Date(iso).getTime() - Date.now()) / 60000));
  return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`;
}

// ---------- En direct ----------
let liveTimer = null, liveOpen = new Set();
const STATE_FR = { FUT:'À venir', PRE:'Avant-match', LIVE:'En cours', CRIT:'En cours', FINAL:'Final', OFF:'Final' };
function gameStatus(g){
  if (g.state === 'LIVE' || g.state === 'CRIT') {
    if (g.in_intermission) return `Entracte ${g.period || ''}`;
    const per = g.period_type === 'OT' ? 'Prol.' : g.period_type === 'SO' ? 'Fus.' : `${g.period || ''}e`;
    return `${per} ${g.clock || ''}`;
  }
  if (g.state === 'FUT' || g.state === 'PRE') return g.start_utc ? new Date(g.start_utc).toLocaleTimeString('fr-CA', { hour:'2-digit', minute:'2-digit' }) : STATE_FR[g.state];
  return g.period_type === 'OT' ? 'Final (prol.)' : g.period_type === 'SO' ? 'Final (fus.)' : 'Final';
}
function shiftDate(d, n){ const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
const fr2 = v => v.toLocaleString('fr-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const vLive = run(async (date) => {
  const first = !$('#liveWrap');
  if (first) $('#view').innerHTML = `<h2 class="title">En direct</h2><div id="liveWrap"><div class="empty">Chargement des matchs…</div></div>`;
  const L = await api('/api/live' + (date ? '?date=' + date : ''));
  if (!$('#liveWrap')) return;
  const isToday = L.date === L.today;
  const anyLive = L.games.some(g => g.state === 'LIVE' || g.state === 'CRIT');
  const games = L.games.map(g => `<div class="game ${g.state === 'LIVE' || g.state === 'CRIT' ? 'live' : ''}">
      <div class="t"><span>${esc(g.away)}</span><span>${g.away_score ?? ''}</span></div>
      <div class="t"><span>${esc(g.home)}</span><span>${g.home_score ?? ''}</span></div>
      <div class="s">${g.state === 'LIVE' || g.state === 'CRIT' ? '<span class="dot"></span>' : ''}${esc(gameStatus(g))}</div></div>`).join('');
  const rows = L.teams.map(t => {
    const open = liveOpen.has(t.id);
    const detail = open ? `<tr class="detail"><td colspan="9">${t.players.length ? t.players.map(p => `<div class="pl">
        <span><span class="pos pos-${p.pos}">${p.pos}</span> <b>${esc(p.name)}</b> · ${esc(p.team || '')}${p.state === 'LIVE' || p.state === 'CRIT' ? ' <span class="dot"></span>' : ''}</span>
        <span>${p.pos === 'G' ? `${p.wins ? 'V' : p.ot_losses ? 'DP' : '—'}${p.shutouts ? ' · BL' : ''}` : `${p.goals} B · ${p.assists} A`} · <b>${p.pts} pt${p.pts > 1 ? 's' : ''}</b></span></div>`).join('')
        : '<div class="pl">Aucun joueur n\'a encore joué.</div>'}</td></tr>` : '';
    return `<tr class="lrow ${t.id === S.me.teamId ? 'me' : ''}" onclick="toggleLive(${t.id})">
      <td class="n">${t.rank}. ${esc(t.name)}</td><td>${t.scheduled}</td>
      <td class="sep">${t.liveGp}</td><td class="hot">${t.livePts}</td><td>${fr2(t.liveAvg)}</td>
      <td class="sep">${t.cumGp}</td><td class="hot">${t.cumPts}</td><td>${fr2(t.cumAvg)}</td><td>${t.diff ? '+' + t.diff : '–'}</td></tr>${detail}`;
  }).join('');
  $('#liveWrap').innerHTML = `
    <div class="datebar">
      <button class="btn small ghost" onclick="location.hash='#/direct/${shiftDate(L.date, -1)}'">‹</button>
      <input type="date" id="liveDate" value="${L.date}" max="${L.today}">
      <button class="btn small ghost" onclick="location.hash='#/direct/${shiftDate(L.date, 1)}'" ${isToday ? 'disabled' : ''}>›</button>
    </div>
    ${L.games.length ? `<div class="games">${games}</div>` : '<p class="muted">Aucun match de la LNH cette journée.</p>'}
    ${L.ready ? '' : '<div class="issues">Premier chargement : le serveur récupère tous les matchs de la saison (quelques minutes). Les totaux se compléteront tout seuls.</div>'}
    <div class="card" style="padding:8px 8px 4px;overflow-x:auto">
      <table class="lt">
        <tr><th></th><th></th><th class="grp" colspan="3">${isToday ? 'Live' : 'Journée'}</th><th class="grp" colspan="4">Cumulatif</th></tr>
        <tr><th class="n">Poolers</th><th title="Joueurs dont l'équipe joue">📅</th><th class="sep">PJ</th><th>Tot</th><th>Moy</th><th class="sep">PJ</th><th>Tot</th><th>Moy</th><th>Dif</th></tr>
        ${rows}
      </table>
    </div>
    <p class="muted">📅 joueurs dont l'équipe joue · PJ/Tot/Moy de la journée : tous les joueurs de l'alignement ·
      Cumulatif : les 9 A, 4 D et 2 G qui comptent (art. 2.3), matchs en cours inclus. Touchez une équipe pour voir ses marqueurs.
      ${isToday ? `Mis à jour ${ago(L.lastLive)}${anyLive ? ', rafraîchi chaque minute' : ''}.` : ''}</p>`;
  $('#liveDate').onchange = e => { if (e.target.value) location.hash = '#/direct/' + e.target.value; };
  window._liveDate = L.date;
  if (isToday && !liveTimer) liveTimer = setInterval(() => { if (!document.hidden && $('#liveWrap')) vLive(); }, 60 * 1000);
});

// ---------- Échanges ----------
const roundFr = r => r === 1 ? '1re' : `${r}e`;
function pickShort(p){ return `${p.year} · ${roundFr(p.round)}${p.original_team_id !== p.owner_team_id ? ' (' + esc(p.original_team) + ')' : ''}`; }
function picksChips(list){

function tradeItems(list){
  return list.length ? list.map(i => `<div>${i.kind === 'player' ? `<span class="pos pos-${i.pos}">${i.pos}</span> ${esc(i.label)} <span class="aav">${money(i.aav)}</span>${i.retain_pct ? ` <span class="tag cap">retenue ${i.retain_pct} %</span>` : ''}`
    : '🎟️ ' + esc(i.label.replace('Choix ', ''))}</div>`).join('') : '<div class="muted">—</div>';
}
function tradeCard(t){
  const mineFrom = t.from_team_id === S.me.teamId, mineTo = t.to_team_id === S.me.teamId;
  const cls = { proposed:'wait', accepted:'wait', completed:'ok' }[t.status] || 'no';
  const acts = [];
  if (mineTo && t.status === 'proposed') acts.push(`<button class="btn small" onclick="tradeAct(${t.id},'accept')">Accepter</button>`,
    `<button class="btn small ghost" onclick="location.hash='#/offre/${t.from_team_id}-${t.id}'">Contre-offre</button>`,
    `<button class="btn small danger" onclick="tradeAct(${t.id},'refuse')">Refuser</button>`);
  if (mineFrom && ['proposed','accepted'].includes(t.status)) acts.push(`<button class="btn small danger" onclick="tradeAct(${t.id},'cancel')">Annuler</button>`);
  if (S.me.isAdmin && t.status === 'accepted') acts.push(`<button class="btn small" onclick="tradeAct(${t.id},'approve')">✓ Approuver</button>`,
    `<button class="btn small danger" onclick="tradeAct(${t.id},'reject')">Rejeter</button>`);
  return `<div class="trade">
    <div class="hd"><span>${esc(t.from_team)} ⇄ ${esc(t.to_team)}</span><span class="pill ${cls}">${esc(t.status_label)}</span></div>
    <div class="cols">
      <div><h5>${esc(t.from_team)} envoie</h5>${tradeItems(t.items.filter(i => i.from_team_id === t.from_team_id))}</div>
      <div><h5>${esc(t.to_team)} envoie</h5>${tradeItems(t.items.filter(i => i.from_team_id === t.to_team_id))}</div>
    </div>
    ${t.message ? `<p class="muted" style="margin:8px 0 0">💬 ${esc(t.message)}</p>` : ''}
    ${t.reply ? `<p class="muted" style="margin:4px 0 0">↩︎ ${esc(t.reply)}</p>` : ''}
    <div class="meta muted" style="margin-top:6px;font-size:11px">#${t.id} · ${new Date(t.updated_at).toLocaleString('fr-CA', { dateStyle:'medium', timeStyle:'short' })}</div>
    ${acts.length ? `<div class="actions">${acts.join('')}</div>` : ''}
  </div>`;
}
const vTrades = run(async () => {
  const [T, W] = await Promise.all([api('/api/trades'), api('/api/waivers')]);
  const me = S.me.teamId, list = T.trades;
  const todo = list.filter(t => (t.to_team_id === me && t.status === 'proposed') || (S.me.isAdmin && t.status === 'accepted'));
  const sent = list.filter(t => t.from_team_id === me && ['proposed','accepted'].includes(t.status) && !todo.includes(t));
  const pendingOthers = S.me.isAdmin ? list.filter(t => t.status === 'proposed' && t.from_team_id !== me && t.to_team_id !== me) : [];
  const done = list.filter(t => t.status === 'completed');
  const closed = list.filter(t => ['refused','cancelled','rejected','expired'].includes(t.status) && (t.from_team_id === me || t.to_team_id === me || S.me.isAdmin));
  const sec = (title, arr, empty) => `<h3 class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px">${title}${arr.length ? ' · ' + arr.length : ''}</h3>
    ${arr.length ? arr.map(tradeCard).join('') : `<p class="muted">${empty}</p>`}`;
  $('#view').innerHTML = `<h2 class="title">Échanges</h2>
    <button class="btn" style="width:100%" onclick="location.hash='#/offre'">⇄ Proposer un échange</button>
    <div class="row" style="margin-top:8px"><a class="btn ghost small" style="text-align:center;text-decoration:none" href="#/choix">🎟️ Choix de repêchage</a></div>
    ${T.deadline ? `<p class="muted">Date limite des transactions : <b>${esc(T.deadline)} à 21 h</b>${T.deadlinePassed ? ' — <span style="color:var(--red)">passée</span>' : ''} (art. 5.1).</p>` : ''}
    <p class="muted">${T.approvalRequired ? 'Une fois acceptée par l\'autre pooler, l\'offre est approuvée par le commissaire.' : 'Une offre acceptée est complétée immédiatement.'}</p>
    ${waiverSection(W)}
    ${sec('À traiter', todo, 'Rien en attente.')}
    ${sec('Mes offres envoyées', sent, 'Aucune offre en cours.')}
    ${S.me.isAdmin ? sec('Négociations en cours (autres équipes)', pendingOthers, 'Aucune.') : ''}
    ${sec('Échanges complétés', done, 'Aucun échange pour l\'instant.')}
    ${closed.length ? `<details><summary>Offres fermées (${closed.length})</summary>${closed.map(tradeCard).join('')}</details>` : ''}`;
});
const tradeAct = run(async (id, action) => {
  const labels = { accept:'Accepter cette offre ?', refuse:'Refuser cette offre ?', cancel:'Annuler ton offre ?', approve:'Approuver et compléter l\'échange ?', reject:'Rejeter cet échange ?' };
  if (!confirm(labels[action])) return;
  const reply = ['refuse','reject'].includes(action) ? (prompt('Un mot pour l\'autre pooler ? (optionnel)') || '') : '';
  await api(`/api/trades/${id}/${action}`, { reply });
  toast({ accept:'Offre acceptée', refuse:'Offre refusée', cancel:'Offre annulée', approve:'Échange complété', reject:'Échange rejeté' }[action]);
  await loadState(); vTrades();
});

function waiverSection(W){
  const open = W.waivers.filter(w => w.status === 'open'), past = W.waivers.filter(w => w.status !== 'open');
  const row = w => `<div class="trade">
    <div class="hd"><span><span class="pos pos-${w.pos}">${w.pos}</span> ${esc(w.name)}</span>
      <span class="pill ${w.status === 'open' ? 'wait' : w.status === 'claimed' ? 'ok' : ''}">${w.status === 'open' ? '⏳ ' + timeLeft(w.ends_at) : w.status === 'claimed' ? '→ ' + esc(w.winner_team) : 'agent libre'}</span></div>
    <div class="muted" style="font-size:13px">${esc(w.nhl_team || '')} · ${w.pts} pts · <span class="aav">${money(w.aav)}</span> · libéré par ${esc(w.from_team || '—')}
      ${w.status === 'open' ? ` · ${w.claims} réclamation${w.claims > 1 ? 's' : ''}` : ''}${w.note ? ' · ' + esc(w.note) : ''}</div>
    ${w.status === 'open' ? `<div class="actions">${w.mine ? `<button class="btn small danger" onclick="unclaimWaiver(${w.id})">Retirer ma réclamation</button>`
        : w.from_team === S.me.name ? '' : `<button class="btn small" onclick="openWaiverClaim(${w.id})">Réclamer</button>`}
      ${S.me.isAdmin ? `<button class="btn small ghost" onclick="waiverAdmin(${w.id},'end')">Terminer</button><button class="btn small ghost" onclick="waiverAdmin(${w.id},'cancel')">Annuler</button>` : ''}</div>` : ''}
  </div>`;
  return `<h3 class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px">Ballottage${open.length ? ' · ' + open.length : ''}</h3>
    ${open.length ? open.map(row).join('') : '<p class="muted">Aucun joueur au ballottage.</p>'}
    <details style="margin-bottom:6px"><summary>Ordre de priorité (${esc(W.priority.basis)}) · période de ${W.hours} h${W.costsPick ? ' · coûte un choix de 1re ronde' : ''}</summary>
      <div class="list">${W.priority.teams.map(t => `<div class="item" style="cursor:default"><div class="rank">${t.priority}</div><div class="grow"><div class="name">${esc(t.name)}</div>
        <div class="meta">${W.priority.basis === 'saison précédente' ? (t.prev_rank ? t.prev_rank + 'e la saison passée' : 'rang inconnu') : t.points + ' pts · ' + ppg(t) + ' pt/match'}</div></div></div>`).join('')}</div></details>
    ${past.length ? `<details><summary>Résultats récents (${past.length})</summary>${past.map(row).join('')}</details>` : ''}`;

// Montage d'une offre : deux plateaux, comme l'écran d'échange du jeu NHL.
let OF = null;
const vOffer = run(async (arg) => {
  const [partnerArg, counterArg] = String(arg || '').split('-');
  const P = await api('/api/picks');
  let counter = null;
  if (counterArg) counter = (await api('/api/trades')).trades.find(t => t.id === Number(counterArg)) || null;
  const others = S.teams.filter(t => t.id !== S.me.teamId).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  OF = { partner: Number(partnerArg) || (others[0] && others[0].id), picks: P.picks, give: new Set(), get: new Set(), side: 'me', kind: 'players', counter, ret: {} };
  if (counter) {   // contre-offre : on part de l'offre reçue, vue de mon côté
    for (const i of counter.items) (i.from_team_id === S.me.teamId ? OF.give : OF.get).add(`${i.kind === 'player' ? 'p' : 'k'}${i.id}`);
  }
  renderOffer();
});
function offerAssets(teamId){
  const t = team(teamId);
  const players = ['F','D','G'].flatMap(pos => t.positions[pos].players);
  const picks = OF.picks.filter(p => p.owner_team_id === teamId && !p.used);
  return { t, players, picks };
}
function assetLabel(key){
  const id = Number(key.slice(1));
  if (key[0] === 'p') { const p = findPlayer(id); return p ? { text: esc(p.name), sub: `${p.pos} · ${money(p.aav)}` } : { text: '?', sub: '' }; }
  const k = OF.picks.find(x => x.id === id); return { text: '🎟️ ' + (k ? pickShort(k) : '?'), sub: '' };
}
function renderOffer(){
  const others = S.teams.filter(t => t.id !== S.me.teamId).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const me = offerAssets(S.me.teamId), them = offerAssets(OF.partner);
  const set = OF.side === 'me' ? OF.give : OF.get, src = OF.side === 'me' ? me : them;
  const tray = (title, keys, which) => `<div class="side"><h4>${title}</h4>${[...keys].map(k => { const a = assetLabel(k);
    const ret = which === 'me' && k[0] === 'p' ? `<select onclick="event.stopPropagation()" onchange="OF.ret['${k}']=Number(this.value);renderOffer()" title="Retenue de salaire (art. 5.3)"
        style="width:auto;padding:2px 4px;font-size:12px;margin-left:4px">${[0,10,20,25,30,40,50].map(v => `<option value="${v}" ${(OF.ret[k] || 0) === v ? 'selected' : ''}>${v ? 'ret. ' + v + ' %' : 'sans retenue'}</option>`).join('')}</select>` : '';
    return `<div class="it" onclick="offerToggle('${which}','${k}')"><span>${a.text}${ret}</span><span>${a.sub} ✕</span></div>`; }).join('') || '<div class="muted" style="font-size:12px">Touche un élément ci-dessous</div>'}</div>`;
  // Conformité après l'échange (mêmes règles que le serveur, sans les choix qui n'ont pas d'effet).
  const after = (teamId, outKeys, inKeys) => {
    const t = team(teamId);
    const outIds = new Set([...outKeys].filter(k => k[0] === 'p').map(k => Number(k.slice(1))));
    let players = ['F','D','G'].flatMap(pos => t.positions[pos].players).filter(p => !outIds.has(p.id));
    // Retenue : le joueur arrive à salaire réduit, et l'équipe qui l'envoie garde la différence.
    const retOf = k => { const p = findPlayer(Number(k.slice(1))); return Math.round((p.aav_full ?? p.aav ?? 0) * (OF.ret[k] || 0) / 100); };
    for (const k of inKeys) if (k[0] === 'p') { const p = findPlayer(Number(k.slice(1))); players.push(OF.ret[k] ? { ...p, aav: (p.aav || 0) - retOf(k) } : p); }
    const keep = [...outKeys].filter(k => k[0] === 'p' && OF.ret[k]).reduce((s2, k) => s2 + retOf(k), 0);
    const s = summarize(players, (t.retained || 0) + keep);
    return `<div class="impact ${s.issues.length ? 'issues' : 'okbox'}"><b>${esc(t.name)}</b> : masse ${money(t.capUsed)} → <b>${money(s.cap)}</b> · ${s.n.F} A, ${s.n.D} D, ${s.n.G} G
      ${s.issues.length ? '<br>⚠ ' + s.issues.join('<br>⚠ ') : ' ✓'}</div>`;
  };
  const list = OF.kind === 'players'
    ? src.players.map(p => { const k = 'p' + p.id; return `<div class="item ${set.has(k) ? 'sel' : ''}" onclick="offerToggle('${OF.side}','${k}')" style="${set.has(k) ? 'background:#2b2512' : ''}">
        <span class="pos pos-${p.pos}">${p.pos}</span><div class="grow"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.nhl_team || '')} · ${p.pts} pts · ${p.age ? p.age + ' ans · ' : ''}fin ${p.contract_end || '?'}</div></div>
        <div class="num"><span class="aav">${money(p.aav)}</span><div class="meta">${set.has(k) ? '✓ choisi' : '+'}</div></div></div>`; }).join('')
    : `<div class="chips" style="padding:6px 0">${src.picks.map(p => { const k = 'k' + p.id; return `<span class="chip ${set.has(k) ? 'sel' : ''}" style="cursor:pointer" onclick="offerToggle('${OF.side}','${k}')">${pickShort(p)}</span>`; }).join('') || '<span class="muted">Aucun choix disponible.</span>'}</div>`;
  $('#view').innerHTML = `<h2 class="title">${OF.counter ? 'Contre-offre' : 'Nouvelle offre'}</h2>
    <label class="f">Échanger avec</label>
    <select id="ofPartner" style="margin-bottom:12px" ${OF.counter ? 'disabled' : ''}>${others.map(t => `<option value="${t.id}" ${t.id === OF.partner ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
    <div class="tray">${tray('Tu envoies', OF.give, 'me')}${tray(`Tu reçois de ${esc(them.t.name)}`, OF.get, 'them')}</div>
    ${OF.give.size || OF.get.size ? after(S.me.teamId, OF.give, OF.get) + after(OF.partner, OF.get, OF.give) : ''}
    <div class="seg"><button class="${OF.side === 'me' ? 'on' : ''}" onclick="OF.side='me';renderOffer()">Mon équipe</button><button class="${OF.side === 'them' ? 'on' : ''}" onclick="OF.side='them';renderOffer()">${esc(them.t.name)}</button></div>
    <div class="seg"><button class="${OF.kind === 'players' ? 'on' : ''}" onclick="OF.kind='players';renderOffer()">Joueurs (${src.players.length})</button><button class="${OF.kind === 'picks' ? 'on' : ''}" onclick="OF.kind='picks';renderOffer()">Choix (${src.picks.length})</button></div>
    <div class="card"><div class="list">${list}</div></div>
    <textarea id="ofMsg" placeholder="Message pour ${esc(them.t.name)} (optionnel)" style="min-height:70px;font-family:inherit;font-size:15px">${esc(OF.msg || '')}</textarea>
    <div style="height:10px"></div>
    <button class="btn" style="width:100%" onclick="submitOffer()" ${OF.give.size || OF.get.size ? '' : 'disabled'}>Envoyer l'offre</button>
    <p class="muted">L'offre arrive dans l'onglet Échanges de ${esc(them.t.name)}. Un dépassement du plafond après un échange oblige à libérer un joueur (art. 3.2).</p>`;
  $('#ofPartner').onchange = e => { OF.partner = Number(e.target.value); OF.get.clear(); OF.side = 'them'; renderOffer(); };
  $('#ofMsg').oninput = e => { OF.msg = e.target.value; };
}
function offerToggle(which, key){ const s = which === 'me' ? OF.give : OF.get; s.has(key) ? s.delete(key) : s.add(key); renderOffer(); }
const submitOffer = run(async () => {
  const pick = (set, c) => [...set].filter(k => k[0] === c).map(k => Number(k.slice(1)));
  const body = { toTeamId: OF.partner, message: OF.msg || '', counterOf: OF.counter ? OF.counter.id : null,
    give: { players: pick(OF.give, 'p'), picks: pick(OF.give, 'k'),
      retain: Object.fromEntries(Object.entries(OF.ret).filter(([k, v]) => v && OF.give.has(k)).map(([k, v]) => [k.slice(1), v])) }, get: { players: pick(OF.get, 'p'), picks: pick(OF.get, 'k') } };
  if (!confirm(`Envoyer l'offre à ${team(OF.partner).name} ?`)) return;
  await api('/api/trades', body);
  toast('Offre envoyée'); location.hash = '#/echanges';
});

// Choix de repêchage : qui possède quoi, et l'historique des échanges de choix.
const vPicks = run(async (teamArg) => {

  window._picks = P.picks;
});

function shortName(n){ return n.length > 12 ? n.slice(0, 11) + '…' : n; }
function draftBoard(D){
  const cur = D.picks.find(p => p.id === D.current);
  const head = D.order.map((t, i) => `<th title="${esc(t.name)}">${i + 1}. ${esc(shortName(t.name))}</th>`).join('');
  const rows = [];
  for (let r = 1; r <= D.rounds; r++) {
    const cells = D.order.map(t => {
      const p = D.picks.find(x => x.round === r && x.original_team_id === t.id);
      if (!p) return '<td></td>';
      const traded = p.owner_team_id !== p.original_team_id;
      const cls = [p.id === D.current ? 'cur' : '', p.owner_team_id === S.me.teamId ? 'mine' : '', (p.used && !p.player) || p.skipped ? 'gone' : ''].join(' ');
      const body = p.player ? `<b>${esc(p.player.name)}</b><small>${p.player.pos} · ${esc(p.player.nhl_team || '')}</small>`
        : p.used ? `<small>${esc(p.note || 'utilisé')}</small>`
        : p.skipped ? '<small>équipe complète</small>'
        : p.id === D.current ? '<small style="color:var(--gold);font-weight:700">⏳ au choix</small>' : `<small>#${p.overall}</small>`;
      return `<td class="${cls}" title="Choix #${p.overall}">${body}${traded ? `<span class="own">→ ${esc(shortName(p.owner_team))}</span>` : ''}</td>`;
    }).join('');
    rows.push(`<tr><th class="r">R${r}</th>${cells}</tr>`);
  }
  return `<div class="boardwrap"><table class="db"><thead><tr><th class="r">#</th>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

function renderProtection(adminCard, statusTxt, season, mine){
  const D = PR.D, L = D.rules;
  const autoList = D.roster.filter(p => PR.auto.has(p.id));
  const combo = assignAuto(autoList);
  const rows = ['F','D','G'].map(pos => {
    const list = D.roster.filter(p => p.pos === pos).sort((a, b) => (b.aav || 0) - (a.aav || 0));
    return `<div class="card"><h3>${POS_LABEL[pos]}</h3><div class="list">${list.map(p => {
      const isP = PR.prot.has(p.id), isA = PR.auto.has(p.id);
      return `<div class="item" style="cursor:default;${isP ? 'background:#13261f' : isA ? 'background:#2b2512' : ''}">
        <div class="grow"><div class="name">${esc(p.name)}</div>
          <div class="meta">${esc(p.nhl_team || '')} · ${p.gp} PJ · <span class="aav">${money(p.aav)}</span>${p.cats.length ? ' · ' + p.cats.map(c => `<span class="tag pts">${c}</span>`).join('') : ''}
          ${S.me.isAdmin ? ` <a class="link" style="font-size:11px" onclick="protOverride(${p.id})">⚙</a>` : ''}</div></div>
        ${mine && D.status === 'open' ? `<button class="btn small ${isP ? '' : 'ghost'}" onclick="protToggle('prot',${p.id})">🛡️</button>
        <button class="btn small ${isA ? '' : 'ghost'}" onclick="protToggle('auto',${p.id})" ${p.cats.length ? '' : 'disabled'}>⚡</button>` : (isP ? '🛡️' : isA ? '⚡' : '')}
      </div>`; }).join('')}</div></div>`;
  }).join('');
  const nP = PR.prot.size, nA = PR.auto.size;
  const problems = [];
  if (nP > L.protected) problems.push(`Trop de joueurs protégés : ${nP}/${L.protected}`);
  if (nA && !combo) problems.push('Combinaison automatique non permise (art. 4.3.4)');
  $('#view').innerHTML = `<h2 class="title">Liste de protection</h2>
    <p class="muted">Saison ${season} · ${statusTxt}. ${D.teamId !== S.me.teamId ? `Équipe : <b>${esc((team(D.teamId) || {}).name || '')}</b>.` : ''}
      ${D.submittedAt ? `<br>✓ Liste remise ${ago(D.submittedAt)} (modifiable jusqu'à la date limite).` : ''}</p>
    ${adminCard}
    <div class="stats">
      <div class="stat"><div class="l">🛡️ Protégés</div><div class="v" style="color:${nP > L.protected ? 'var(--red)' : 'inherit'}">${nP}/${L.protected}</div></div>
      <div class="stat"><div class="l">⚡ Automatiques</div><div class="v" style="color:${nA && !combo ? 'var(--red)' : 'inherit'}">${nA}/${L.auto}</div></div>
      <div class="stat"><div class="l">Libérés</div><div class="v">${D.roster.length - nP - nA}</div></div>
    </div>
    ${problems.length ? `<div class="issues">${problems.join('<br>')}</div>` : nA ? `<div class="okbox">Protections automatiques : ${autoList.map((p, i) => `${esc(p.name)} (${combo[i]})`).join(', ')}</div>` : ''}
    <details class="card"><summary>Règles (art. 4.3)</summary><p class="muted">
      <b>R</b> : recrue pendant la saison qui se termine · <b>GP</b> : attaquant/défenseur avec 39 matchs ou moins, gardien avec 20 ou moins ·
      <b>R2</b> : recrue la saison précédente (année supplémentaire). Au plus 3 automatiques : 3 R, 2 R + 1 R2, 1 R + 2 GP, ou 1 R + 1 GP + 1 R2.
      Recrue selon la LNH : moins de 26 ans au 15 septembre, jamais plus de 25 matchs en une saison, pas plus de 6 matchs dans chacune des deux saisons précédentes.</p></details>
    ${rows}
    ${mine && D.status === 'open' ? `<div class="row"><button class="btn ghost" onclick="protSave(false)">Enregistrer le brouillon</button>
      <button class="btn" onclick="protSave(true)" ${problems.length ? 'disabled' : ''}>Remettre ma liste</button></div>` : ''}`;
  window._prArgs = [adminCard, statusTxt, season, mine];
}
function assignAuto(list){
  if (list.length > 3) return null;
  const ok = a => { const n = c => a.filter(x => x === c).length; return n('R2') <= 1 && n('GP') <= 2 && n('GP') + n('R2') <= 2; };
  const walk = (i, acc) => { if (i === list.length) return ok(acc) ? acc : null; for (const c of list[i].cats) { const r = walk(i + 1, [...acc, c]); if (r) return r; } return null; };
  return walk(0, []);
}
function protToggle(which, id){
  const set = which === 'prot' ? PR.prot : PR.auto, other = which === 'prot' ? PR.auto : PR.prot;
  if (set.has(id)) set.delete(id); else { set.add(id); other.delete(id); }
  renderProtection(...window._prArgs);
}

function tradeMoves(){ return [...document.querySelectorAll('.trp:checked')].map(cb => ({ playerId: Number(cb.dataset.p), toTeamId: Number(cb.dataset.to) })); }
// Aperçu local de la conformité après l'échange (mêmes règles que le serveur).
function previewTrade(){
  const moves = tradeMoves(); const el = $('#trPreview');
  if (!moves.length) { el.innerHTML = ''; return; }
  const ids = [Number($('#trA').value), Number($('#trB').value)];
  el.innerHTML = ids.map(id => {
    const t = team(id);
    let players = ['F','D','G'].flatMap(pos => t.positions[pos].players);
    const outIds = new Set(moves.filter(m => m.toTeamId !== id).map(m => m.playerId));
    players = players.filter(p => !outIds.has(p.id));
    for (const m of moves.filter(m => m.toTeamId === id)) players.push(findPlayer(m.playerId));
    const s = summarize(players);
    return `<div class="${s.issues.length ? 'issues' : 'okbox'}"><b>${esc(t.name)} après l'échange</b> : masse ${money(s.cap)} · ${s.n.F} A, ${s.n.D} D, ${s.n.G} G
      ${s.issues.length ? '<br>⚠ ' + s.issues.join('<br>⚠ ') : ' ✓'}</div>`;
  }).join('');
}
function summarize(players, retained = 0){
  const MIN = { F:9, D:4, G:2 }, MAX = { F:18, D:8, G:4 };
  const n = { F:0, D:0, G:0 }; let cap = 0; const issues = [];
  for (const pos of ['F','D','G']) {
    const list = players.filter(p => p.pos === pos); n[pos] = list.length;
    cap += list.map(p => p.aav || 0).sort((a,b) => b - a).slice(0, MIN[pos]).reduce((s,v) => s + v, 0);
    if (n[pos] < MIN[pos]) issues.push(`${POS_LABEL[pos]} : ${n[pos]} (min ${MIN[pos]})`);
    if (n[pos] > MAX[pos]) issues.push(`${POS_LABEL[pos]} : ${n[pos]} (max ${MAX[pos]})`);
  }
  cap += retained;
  if (cap > S.config.cap) issues.push(`plafond dépassé de ${moneyFull(cap - S.config.cap)}`);
  if (S.config.floor && cap < S.config.floor) issues.push(`sous le plancher de ${moneyFull(S.config.floor - cap)}`);
  return { n, cap, issues };
}

function noiseBuffer(sec){ const b = audioCtx.createBuffer(1, audioCtx.sampleRate * sec, audioCtx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
function playSynth(h){

    const g = audioCtx.createGain(), lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3000;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.18, t0 + .02); g.gain.setValueAtTime(.18, t0 + h.buzzer); g.gain.linearRampToValueAtTime(0, t0 + h.buzzer + .05);
    for (const f of [180, 182, 360]) { const o = audioCtx.createOscillator(); o.type = 'square'; o.frequency.value = f; o.connect(lp); o.start(t0); o.stop(t0 + h.buzzer + .1); }
    lp.connect(g); g.connect(comp); return;
  }
  const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = h.cutoff; lp.Q.value = 2; lp.connect(comp);
  let lfoGain = null;
  if (h.vibrato) { const lfo = audioCtx.createOscillator(); lfoGain = audioCtx.createGain(); lfo.frequency.value = 6; lfoGain.gain.value = h.vibrato; lfo.connect(lfoGain); lfo.start(t0); lfo.stop(t0 + 6); }
  for (const [start, len] of h.blasts) {
    const t = t0 + start, g = audioCtx.createGain(), vol = .26 / Math.sqrt(h.freqs.length / 3);
    // Attaque d'un klaxon à air : le son monte vite et la note se stabilise en une fraction de seconde.
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .06);
    g.gain.setValueAtTime(vol, t + len - .15); g.gain.linearRampToValueAtTime(0, t + len);
    g.connect(lp);
    for (const f of h.freqs) for (const det of [-3, 3]) {
      const o = audioCtx.createOscillator(); o.type = h.wave; o.detune.value = det;
      o.frequency.setValueAtTime(f * .94, t); o.frequency.exponentialRampToValueAtTime(f, t + .18);
      if (lfoGain) lfoGain.connect(o.frequency);
      o.connect(g); o.start(t); o.stop(t + len + .05);
    }
  }
  if (h.crowd) {   // la foule qui se lève : bruit filtré qui gonfle puis retombe
    const n = audioCtx.createBufferSource(), g = audioCtx.createGain(), bp = audioCtx.createBiquadFilter();
    n.buffer = noiseBuffer(h.crowd); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .6;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.35, t0 + .8); g.gain.setValueAtTime(.35, t0 + h.crowd - 1.5); g.gain.linearRampToValueAtTime(0, t0 + h.crowd);
    n.connect(bp); bp.connect(g); g.connect(comp); n.start(t0);
  }
}
function goalHorn(choice){
  if (!audioCtx || localStorageGet('pav_sound') === 'off') return;
  if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 600]);
  const c = choice || hornChoice();
  if (c === 'perso' && hornBuffer) {
    const src = audioCtx.createBufferSource(), g = audioCtx.createGain(); g.gain.value = .9;
    src.buffer = hornBuffer; src.connect(g); g.connect(audioCtx.destination); src.start(); return;
  }
  playSynth(HORNS[c] || HORNS.original);
}
function showBanner(n){
  const alarm = n.kind === 'trade';
  const el = document.createElement('div');
  el.className = 'banner' + (alarm ? ' alarm' : '');
  el.innerHTML = `<div class="ico">${NOTIF_ICON[n.kind] || '🔔'}</div><div><div class="tt">${esc(n.title)}</div>${n.body ? `<div class="bd">${esc(n.body)}</div>` : ''}
    ${alarm ? '<div class="bd" style="margin-top:4px;font-weight:700;color:#fff">Touche pour voir la transaction ›</div>' : ''}</div><div class="x">✕</div>`;
  el.onclick = e => { el.remove(); if (!e.target.classList.contains('x') && n.link) location.hash = n.link; };
  $('#banners').prepend(el);
  if (alarm) goalHorn();
  setTimeout(() => el.remove(), alarm ? 15000 : 7000);
}
async function pollNotifications(){
  if (!S || document.hidden) return;
  try {
    const N = await api('/api/notifications?after=' + notifLast);
    const fresh = N.notifications.slice().reverse();
    if (fresh.length) {
      // Premier lancement sur cet appareil : on n'affiche pas tout l'historique d'un coup.
      const first = !notifLast;
      if (!first) { fresh.slice(-3).forEach(showBanner); S.unreadNotifications = (S.unreadNotifications || 0) + fresh.length; renderChrome(); }
      notifLast = fresh[fresh.length - 1].id; localStorageSet('pav_notif_last', String(notifLast));
    }
  } catch {}
}
function startNotifications(){ if (!notifTimer) notifTimer = setInterval(pollNotifications, 30000); pollNotifications(); }

const hornReset = run(async () => { await api('/api/admin/horn', { data: '' }); hornBuffer = null; await loadState(); toast('Klaxon synthétique rétabli'); vNotifications(); });
const vNotifications = run(async () => {
  const N = await api('/api/notifications');
  const top = N.notifications[0]?.id || 0;
  const pushOk = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const iOS = /iPhone|iPad/.test(navigator.userAgent);
  $('#view').innerHTML = `<h2 class="title">Notifications</h2>
    <div class="card" id="pushCard"><h3>Sur ce téléphone</h3>
      ${!pushOk ? `<p class="muted">${iOS && !standalone ? 'Sur iPhone, ajoute d\'abord l\'application à ton écran d\'accueil (Partager ⬆︎ → Sur l\'écran d\'accueil), puis ouvre-la depuis l\'icône pour activer les notifications.' : 'Ce navigateur ne permet pas les notifications.'}</p>`
        : '<div id="pushBody" class="muted">Chargement…</div>'}
      <label class="pick"><input type="checkbox" id="soundTog" ${localStorageGet('pav_sound') === 'off' ? '' : 'checked'}> 🚨 Sirène de but dans l'application lors d'une transaction</label>
      <label class="f" style="margin-top:8px">Ma sirène</label>
      ${[...Object.entries(HORNS), ...(S.config.hornVersion ? [['perso', { label: '🎵 Son de la ligue (téléversé par le commissaire)' }]] : [])].map(([k, h]) => `<div class="pick" style="justify-content:space-between">
        <label style="display:flex;gap:8px;align-items:center;flex:1"><input type="radio" name="horn" value="${k}" ${hornChoice() === k ? 'checked' : ''} onchange="localStorageSet('pav_horn','${k}');goalHorn('${k}')"> ${esc(h.label)}</label>
        <button class="btn small ghost" onclick="goalHorn('${k}')">▶</button></div>`).join('')}
    </div>
    ${S.me.isAdmin ? `<div class="card"><h3>Son de la sirène (commissaire)</h3>
      <p class="muted">${S.config.hornVersion ? '✅ Un son personnalisé est en place.' : 'Klaxon d\'aréna synthétique.'} Téléverse un fichier MP3 (1 Mo maximum, quelques secondes) que tu as le droit d'utiliser : il s'ajoute aux choix de sirène de chaque pooler.</p>
      <label class="btn small" style="display:inline-block">📁 Choisir un fichier<input type="file" id="hornFile" accept="audio/*" hidden></label>
      ${S.config.hornVersion ? '<button class="btn small ghost" onclick="hornReset()">Revenir au klaxon synthétique</button>' : ''}</div>` : ''}
    <div class="card"><div class="list">${N.notifications.map(n => `<div class="notif ${n.id > N.seen ? 'new' : ''}" onclick="${n.link ? `location.hash='${n.link}'` : ''}">
      <div class="ico">${NOTIF_ICON[n.kind] || '🔔'}</div><div class="grow"><div class="name" style="white-space:normal">${esc(n.title)}</div>
      ${n.body ? `<div class="meta">${esc(n.body)}</div>` : ''}<div class="meta">${ago(n.at)}</div></div></div>`).join('') || '<div class="empty">Aucune notification pour l\'instant.</div>'}</div></div>`;
  const hf = $('#hornFile');
  if (hf) hf.onchange = run(async e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 1024 * 1024) return toast('Fichier trop gros (maximum 1 Mo)');
    const data = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(f); });
    await api('/api/admin/horn', { data }); await loadState(); await loadHorn(); toast('Nouveau son en place'); goalHorn('perso'); vNotifications();
  });
  $('#soundTog').onchange = e => { localStorageSet('pav_sound', e.target.checked ? 'on' : 'off'); if (e.target.checked) goalHorn(); };
  if (top) { api('/api/notifications/seen', { id: top }).catch(() => {}); S.unreadNotifications = 0; renderChrome(); }
  if (pushOk) renderPush(N);
});
function urlB64(b64){ const p = '='.repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); }
async function renderPush(N){
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  const st = sub ? await api('/api/push/status', { endpoint: sub.endpoint }) : { subscribed: false, kinds: [] };
  const on = sub && st.subscribed;
  const kinds = on ? st.kinds : Object.keys(N.kinds).filter(k => k !== 'admin' || S.me.isAdmin);
  $('#pushBody').innerHTML = `
    <p class="muted">${on ? '✅ Les notifications sont activées sur ce téléphone.' : 'Reçois les alertes même quand l\'application est fermée.'}</p>
    ${Object.entries(N.kinds).filter(([k]) => k !== 'admin' || S.me.isAdmin).map(([k, l]) => `<label class="pick"><input type="checkbox" class="pkind" value="${k}" ${kinds.includes(k) ? 'checked' : ''}> ${esc(l)}</label>`).join('')}
    <div class="row" style="margin-top:8px">
      <button class="btn small" id="pushOn">${on ? 'Enregistrer mes choix' : '🔔 Activer les notifications'}</button>
      ${on ? '<button class="btn small ghost" id="pushTest">Tester</button><button class="btn small danger" id="pushOff">Désactiver</button>' : ''}
    </div>`;
  $('#pushOn').onclick = run(async () => {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Notifications refusées dans les réglages du téléphone');
    const s2 = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(N.publicKey) });
    await api('/api/push/subscribe', { subscription: s2.toJSON(), kinds: [...document.querySelectorAll('.pkind:checked')].map(i => i.value) });
    toast('Notifications activées'); renderPush(N);
  });
  if (on) {
    $('#pushTest').onclick = run(async () => { await api('/api/push/test', { endpoint: sub.endpoint }); toast('Notification de test envoyée'); });
    $('#pushOff').onclick = run(async () => { await api('/api/push/unsubscribe', { endpoint: sub.endpoint }); await sub.unsubscribe(); toast('Notifications désactivées'); renderPush(N); });
  }
}

    <p><a class="link" href="#/echanges">‹ Tous les échanges</a> · <a class="link" href="#/historique">Historique des mouvements</a></p>`;
});
