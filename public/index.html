<meta name="theme-color" content="#0b1622">
<script>
// Thème avant l'affichage (évite un éclair de la mauvaise couleur) : réglage « pav_theme ».
// « auto » : sombre le soir et la nuit (19 h à 7 h), ou le jour si le téléphone est en mode sombre ; « phone » : mode du téléphone seulement.
(function(){
  var t = 'auto'; try { t = localStorage.getItem('pav_theme') || 'auto'; } catch (e) {}
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  function apply(){
    var h = new Date().getHours(), night = h >= 19 || h < 7;
    var d = t === 'auto' ? (night || !mq.matches ? 'dark' : 'light') : t === 'phone' ? (mq.matches ? 'light' : 'dark') : t;
    document.documentElement.setAttribute('data-theme', d);
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', d === 'light' ? '#eef2f7' : '#0b1622');
  }
  apply();
  if (mq.addEventListener) mq.addEventListener('change', function(){ if (t === 'auto' || t === 'phone') apply(); });
  // L'heure change pendant que l'application reste ouverte (ou revient de l'arrière-plan).
  setInterval(function(){ if (t === 'auto') apply(); }, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && t === 'auto') apply(); });
  window.setTheme = function(v){ t = v; try { localStorage.setItem('pav_theme', v); } catch (e) {} apply(); };
  window.themePref = function(){ return t; };
})();
</script>

<style>
  /* Thèmes : sombre (par défaut) et clair. html[data-theme] est fixé au chargement (réglage ou mode du téléphone). */
  :root{
    --bg:#0b1622; --ice:var(--bg); --panel:#121f2e; --panel-2:#182838; --panel-3:#0e1a28; --line:#233648; --line-soft:#1a2938;
    --text:#dfe9f2; --dim:#8ea3b8; --gold:#c9a24b; --gold-fill:#c9a24b; --accent-ink:#1a1405; --red:#e07466; --green:#5ba088; --hot:#ff5a4f;
    --warn-bg:#2b2512; --warn-line:#5a4a1e; --ok-bg:#13261f; --ok-line:#2f5e4a; --ok-ink:#9fd8bf;
    --bad-bg:#2a1716; --bad-line:#5a2a26; --bad-ink:#f0b3aa; --info-bg:#16233a; --info-line:#8fb4d6; --info-ink:#b5d3ee;
    --orange-bg:#2a1d10; --orange-line:#6b4a1e; --orange-ink:#f0a35a; --mine-bg:#141d2c;
    --posF-bg:#2a3f2f; --posF:#8fd6a4; --posD-bg:#2a333f; --posD:#8fb4d6; --posG-bg:#3f2a2a; --posG:#d68f8f;
    --top-bg:rgba(11,22,34,.92); --tabbar:rgba(14,26,40,.96); --shadow:none; --shadow-lg:0 8px 24px rgba(0,0,0,.45);
    --hero-mid:45%; --hero-end:var(--panel); --hero-ink:#fff; --hero-sub:rgba(255,255,255,.88); --hero-pill:rgba(0,0,0,.25); --hero-pill-line:rgba(255,255,255,.12);
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel-2:#f3f6fa; --panel-3:#f6f8fb; --line:#dde3ec; --line-soft:#e8edf3;
    --text:#10151c; --dim:#5d6a7a; --gold:#9a6f0c; --gold-fill:#f2c94c; --accent-ink:#2a1e00; --red:#d0392e; --green:#1d8a58; --hot:#e0352b;
    --warn-bg:#fff6dc; --warn-line:#efd58e; --ok-bg:#e4f6ec; --ok-line:#a9dcc1; --ok-ink:#17653f;
    --bad-bg:#fdeaea; --bad-line:#f2bcb8; --bad-ink:#9f2219; --info-bg:#e7f0fb; --info-line:#a9c7ea; --info-ink:#1d4f80;
    --orange-bg:#fff0e0; --orange-line:#f3c48f; --orange-ink:#a35700; --mine-bg:#fff8e6;
    --posF-bg:#dcf3e4; --posF:#17653f; --posD-bg:#dde9f8; --posD:#1d4f80; --posG-bg:#f8e1e1; --posG:#9f2219;
    --top-bg:rgba(255,255,255,.9); --tabbar:rgba(255,255,255,.95); --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06); --shadow-lg:0 10px 30px rgba(16,24,40,.18);
    --hero-mid:16%; --hero-end:#ffffff; --hero-ink:#0d1117; --hero-sub:#1e2a38; --hero-pill:rgba(255,255,255,.65); --hero-pill-line:rgba(16,24,40,.08);
    color-scheme:light;
  }
  [hidden]{display:none !important;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--ice);color:var(--text);}

       padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .brand{display:flex;align-items:center;gap:8px;min-width:0;}

  #banners{position:fixed;left:0;right:0;top:calc(8px + var(--safe-t));z-index:70;display:flex;flex-direction:column;gap:8px;padding:0 10px;pointer-events:none;}
  .banner{pointer-events:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.45);
          display:flex;gap:10px;align-items:flex-start;cursor:pointer;animation:slidein .35s ease;max-width:560px;margin:0 auto;width:100%;}
  .banner .ico{font-size:24px;line-height:1;}
  .banner .tt{font-weight:800;font-size:15px;} .banner .bd{font-size:13px;color:var(--dim);margin-top:2px;}
  .banner .x{margin-left:auto;color:var(--dim);font-size:18px;padding:0 0 0 8px;}
  .banner.alarm{background:linear-gradient(135deg,#b3121f,#6d0a12);border-color:#ff5a5a;animation:slidein .35s ease, shake .5s .35s 3, flash 1s .35s 6;}

  .banner.alarm .ico{font-size:34px;animation:siren .6s linear infinite;}
  @keyframes slidein{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}

  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}

  .btn.danger{background:transparent;border:1px solid var(--red);color:var(--red);}
  .btn.small{padding:7px 10px;font-size:13px;border-radius:8px;}

  .seg button.on{background:var(--panel-2);color:var(--text);}
  .seg.tight button{font-size:12px;white-space:nowrap;padding:8px 2px;}
  .list{display:flex;flex-direction:column;}
  .item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .item:last-child{border-bottom:none;}
  .item .grow{flex:1;min-width:0;}
  .item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .meta{font-size:12px;color:var(--dim);margin-top:2px;}
  .item .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .item .num b{font-size:17px;}
  .item.taken{opacity:.45;}
  .item.out .name{color:var(--dim);font-weight:500;}
  .rank{width:26px;height:26px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;}
  .rank.po{background:var(--warn-bg);color:var(--gold);}
  .cutline{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;padding:6px 0;border-bottom:1px dashed var(--gold);margin-bottom:2px;}
  .pos{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;flex:none;}
  .pos-F{background:var(--posF-bg);color:var(--posF);} .pos-D{background:var(--posD-bg);color:var(--posD);} .pos-G{background:var(--posG-bg);color:var(--posG);}
  .aav{color:var(--gold);font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--dim);margin-left:4px;vertical-align:1px;}
  .tag.pts{border-color:var(--green);color:var(--green);} .tag.cap{border-color:var(--gold);color:var(--gold);}

  .stat .l{font-size:11px;color:var(--dim);}

  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 2px;}
  .bar i{display:block;height:100%;background:var(--green);} .bar i.over{background:var(--red);}
  .annonce{position:relative;background:linear-gradient(135deg,var(--panel-2),var(--panel));border:1px solid var(--gold);border-left:5px solid var(--gold);border-radius:14px;padding:12px 38px 12px 14px;margin:0 0 14px;}

  .annonce .tt{font-weight:800;font-size:16px;margin-bottom:4px;}
  .annonce .bd{white-space:pre-wrap;font-size:14px;line-height:1.4;}
  .annonce .x{position:absolute;top:8px;right:8px;background:transparent;border:none;color:var(--dim);font-size:18px;padding:4px 8px;}
  .conv-toc a{display:block;padding:5px 0;color:var(--text);text-decoration:none;font-size:14px;}
  .conv-toc a.l2{padding-left:16px;color:var(--dim);font-size:13px;} .conv-toc a.l3{padding-left:32px;color:var(--dim);font-size:13px;}
  .conv h3.c1{font-size:19px;margin:22px 0 8px;color:var(--gold);text-transform:none;letter-spacing:0;}

          display:flex;padding-bottom:var(--safe-b);}

  .tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px;line-height:14px;}
  .tabbar a.on{color:var(--gold);}

  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;
         border:1px solid var(--line);max-height:88vh;overflow:auto;padding:8px 16px calc(18px + var(--safe-b));transform:translateY(105%);transition:transform .22s,visibility .22s;visibility:hidden;}
  .sheet.open{transform:none;visibility:visible;} .sheet-bg.open{display:block;}

function money(n){ if (n === null || n === undefined) return '—'; return (n/1e6).toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:3}) + ' M$'; }
function moneyFull(n){ return Math.round(n).toLocaleString('fr-CA') + ' $'; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function ago(iso){
  if (!iso) return 'jamais';
  const m = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if (m < 1) return 'à l\'instant'; if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m/60); if (h < 24) return `il y a ${h} h`;
  return new Date(iso).toLocaleDateString('fr-CA');
}
function ppg(t){ return t.ppg.toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function statLine(p){
  if (p.pos === 'G') return `${p.gp} PJ · ${p.wins} V · ${p.ot_losses} DP · ${p.shutouts} BL`;
  return `${p.gp} PJ · ${p.goals} B · ${p.assists} A`;
}
// Le serveur gratuit s'endort après un moment sans visite. Pendant son réveil, Render répond par sa
// propre page d'attente (pas du JSON) : on affiche un écran d'attente et on réessaie tout seul.
async function pfetch(path, opts = {}){
  const start = Date.now();
  for (let i = 0; ; i++) {
    let res = null;
    try { res = await fetch(path, opts); } catch (e) { if (opts.method && opts.method !== 'GET') throw e; }
    if (res && res.headers.get('X-Pool-App')) { wakeScreen(false); return res; }
    if (Date.now() - start > 120000) { wakeScreen(false); throw new Error('Le serveur ne répond pas. Réessaie dans une minute.'); }
    if (i === 0) wakeScreen(true);
    await new Promise(r => setTimeout(r, 2500));
  }
}
function wakeScreen(on){
  let el = document.getElementById('wake');
  if (!on) { if (el) el.remove(); return; }
  if (el) return;
  el = document.createElement('div'); el.id = 'wake';
  el.innerHTML = `<img src="/logo.png" alt=""><b>Réveil du serveur…</b><span>Le serveur gratuit faisait la sieste. Ça prend environ 30 secondes, une seule fois.</span><i></i>`;
  document.body.appendChild(el);
}
async function api(path, body){
  const opts = body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) };
  const res = await pfetch(path, opts);
  if (res.status === 401 && !path.startsWith('/api/login') && !path.startsWith('/api/passkey/login')) {
    if (S) { S = null; showLogin(); }
    throw new Error('Connexion requise (session non conservée)');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
  return data;
}
async function apiDelete(path){
  const res = await fetch(path, { method:'DELETE' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
  return data;
}
function run(fn){ return async (...a) => { try { await fn(...a); } catch(e){ toast(e.message); } }; }

// ---------- Face ID (clés d'accès WebAuthn) ----------
// Le téléphone garde la clé et la débloque avec Face ID, l'empreinte ou son NIP ; aucun code à retenir.
const b64u = {
  enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: str => Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4)), c => c.charCodeAt(0))
};
const passkeyOk = () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
async function passkeyPlatform(){ try { return passkeyOk() && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch { return false; } }
const bioName = () => /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? 'Face ID' : 'l\'empreinte ou le visage';
function deviceLabel(){
  const u = navigator.userAgent;
  return /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Macintosh/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : 'Appareil';
}
function credJSON(c){
  const r = c.response, out = { id: c.id, rawId: b64u.enc(c.rawId), type: c.type, clientExtensionResults: c.getClientExtensionResults ? c.getClientExtensionResults() : {},
    authenticatorAttachment: c.authenticatorAttachment || undefined, response: { clientDataJSON: b64u.enc(r.clientDataJSON) } };
  if (r.attestationObject) { out.response.attestationObject = b64u.enc(r.attestationObject); out.response.transports = r.getTransports ? r.getTransports() : []; }
  if (r.authenticatorData) { out.response.authenticatorData = b64u.enc(r.authenticatorData); out.response.signature = b64u.enc(r.signature); out.response.userHandle = r.userHandle ? b64u.enc(r.userHandle) : undefined; }
  return out;
}
// Annulé par la personne (ou délai dépassé) : pas un vrai problème.
const passkeyCancelled = e => e && (e.name === 'NotAllowedError' || e.name === 'AbortError');
async function passkeyRegister(){
  const { token, options: o } = await api('/api/passkey/register/options', {});
  const pk = { ...o, challenge: b64u.dec(o.challenge), user: { ...o.user, id: b64u.dec(o.user.id) },
    excludeCredentials: (o.excludeCredentials || []).map(c => ({ ...c, id: b64u.dec(c.id) })) };
  let c;
  try { c = await navigator.credentials.create({ publicKey: pk }); }
  catch (e) {
    if (e && e.name === 'InvalidStateError') throw new Error(`${bioName()} est déjà activé sur cet appareil.`);
    if (passkeyCancelled(e)) return false;
    throw e;
  }
  await api('/api/passkey/register/verify', { token, response: credJSON(c), label: deviceLabel() });
  localStorageSet('pav_passkey', '1');
  return true;
}
async function passkeyLogin(){
  const { token, options: o } = await api('/api/passkey/login/options', {});
  let c;
  try { c = await navigator.credentials.get({ publicKey: { ...o, challenge: b64u.dec(o.challenge), allowCredentials: [] } }); }
  catch (e) { if (passkeyCancelled(e)) return false; throw e; }
  await api('/api/passkey/login/verify', { token, response: credJSON(c) });
  localStorageSet('pav_passkey', '1');
  return true;
}

// Choix de repêchage d'une équipe, par saison : ronde, propriétaire d'origine (avec son logo).
let picksYear = null;
function picksTable(all, teamId){ return `<div data-picks="${teamId}">${picksInner(all, teamId)}</div>`; }
function picksRefresh(y){ picksYear = y; document.querySelectorAll('[data-picks]').forEach(el => { el.innerHTML = picksInner(window._picks, Number(el.dataset.picks)); }); }
function picksInner(all, teamId){
  const years = [...new Set(all.map(p => p.year))].sort();
  if (!years.length) return '<p class="muted">Aucun choix.</p>';
  if (!years.includes(picksYear)) picksYear = years[0];
  const own = all.filter(p => p.owner_team_id === teamId && p.year === picksYear).sort((a, b) => a.round - b.round || a.id - b.id);
  const gone = all.filter(p => p.original_team_id === teamId && p.owner_team_id !== teamId && p.year === picksYear);
  return `${years.length > 1 ? `<div class="seg">${years.map(y => `<button class="${y === picksYear ? 'on' : ''}" onclick="picksRefresh(${y})">${y}</button>`).join('')}</div>` : ''}
    <div class="tblw"><table class="tbl"><tr><th class="c">Ronde</th><th>Propriétaire d'origine</th><th></th></tr>
    ${own.map(p => `<tr class="${p.used ? 'used' : ''}" ${S.me.isAdmin ? `onclick="editPick(${p.id})" style="cursor:pointer"` : ''}><td class="c"><b>${p.round}</b></td>
      <td>${tname(team(p.original_team_id))}</td><td style="text-align:right;font-size:12px" class="${p.original_team_id !== teamId ? 'acq' : 'muted'}">${p.used ? 'utilisé' : p.original_team_id !== teamId ? 'acquis' : ''}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Aucun choix cette année.</td></tr>'}
    </table></div>
    ${gone.length ? `<p class="muted" style="margin:-4px 2px 12px">Cédés : ${gone.map(p => `${roundFr(p.round)} → ${esc(p.owner_team)}`).join(' · ')}</p>` : ''}`;
}

function headshot(p){ return p.nhl_id && p.nhl_team && S && S.config && S.config.seasonId ? `https://assets.nhle.com/mugs/nhl/${S.config.seasonId}/${p.nhl_team}/${p.nhl_id}.png` : null; }

// Logo d'équipe en SVG : chandail, bâton, patins, casque, rondelle, bière. Couleurs c1 (principale), c2 (bandes), c3 (détails).
const AV_PALETTE = ['#7d1424','#c8102e','#e85d1f','#f2b705','#f6e7a1','#1f7a3e','#0b6e4f','#00a3ad','#2a6ebb','#0d2a6b','#5b2a86','#1b1b1b','#5b6770','#ffffff','#b4975a','#8a4b2a'];
let avSeq = 0;
function shade(hex, f){ // f < 0 : plus foncé, f > 0 : plus pâle
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function defaultAvatar(name){
  let h = 0; for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const combos = [['#7d1424','#f2b705','#ffffff'],['#0d2a6b','#ffffff','#c8102e'],['#1f7a3e','#f6e7a1','#1b1b1b'],['#2a6ebb','#ffffff','#0d2a6b'],
    ['#f2b705','#5b2a86','#ffffff'],['#1b1b1b','#e85d1f','#ffffff'],['#c8102e','#1b1b1b','#ffffff'],['#00a3ad','#1b1b1b','#ffffff'],['#5b2a86','#f2b705','#ffffff']];
  const [c1, c2, c3] = combos[h % combos.length];
  return { type: ['chandail','chandail','casque','masque','ecusson','baton'][h % 6], c1, c2, c3, letter: String(name || '?').trim()[0].toUpperCase() };
}
function teamIcon(av, size = 40, name = ''){

  const letter = (a.letter || String(name || '?').trim()[0] || '?').toUpperCase().replace(/[<>&"]/g, '');
  const gloss = `<linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>`;
  let body = '';
  if (a.type === 'chandail') {
    const J = 'M22 9 L27 7 Q32 12 37 7 L42 9 L57 18 L52 33 L46 30 L46 55 Q32 59 18 55 L18 30 L12 33 L7 18 Z';
    body = `<defs>${gloss}<clipPath id="${id}c"><path d="${J}"/></clipPath></defs>
      <path d="${J}" fill="${c1}"/>
      <g clip-path="url(#${id}c)">
        <rect x="0" y="22" width="18.5" height="4" fill="${c2}"/><rect x="45.5" y="22" width="20" height="4" fill="${c2}"/>
        <rect x="0" y="27.5" width="18.5" height="2" fill="${c3}"/><rect x="45.5" y="27.5" width="20" height="2" fill="${c3}"/>
        <rect x="0" y="45" width="64" height="4" fill="${c2}"/><rect x="0" y="50.5" width="64" height="2" fill="${c3}"/>
        <path d="${J}" fill="url(#${id}g)"/>
      </g>
      <path d="M27 7 Q32 12 37 7 L35.5 7 Q32 17 28.5 7 Z" fill="${c2}"/><path d="M28.5 7 Q32 15 35.5 7" fill="none" stroke="${c3}" stroke-width="1.2"/>
      <circle cx="32" cy="31" r="7.5" fill="${c2}" stroke="${c3}" stroke-width="1.5"/>
      <text x="32" y="35" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="${letter.length > 1 ? 7.5 : 10}" fill="${c1}">${letter}</text>
      <path d="${J}" fill="none" stroke="${dk}" stroke-width="1.5" stroke-linejoin="round"/>`;

// Logo d'une équipe du pool (choisi par le pooler, sinon un chandail aux couleurs tirées de son nom).
function teamAv(t, size = 32){ return t ? teamIcon(t.avatar, size, t.name) : ''; }
const teamAvId = (id, size) => teamAv(team(id), size);
function tname(t, size = 22){ return t ? `<span class="tname">${teamAv(t, size)}<span>${esc(t.name)}</span></span>` : ''; }

// Éditeur du logo : modèle, trois couleurs et lettre (chandail, rondelle).
let AVE = null;
function openAvatarEditor(teamId){
  const t = team(teamId); if (!t) return;
  AVE = { teamId, a: { ...(t.avatar && t.avatar.type ? t.avatar : defaultAvatar(t.name)) } };
  renderAvatarEditor();
  $('#sheet').classList.add('open'); $('#sheetBg').classList.add('open');
}
function renderAvatarEditor(){
  const a = AVE.a, t = team(AVE.teamId);
  const types = [['chandail', 'Chandail'], ['casque', 'Casque'], ['masque', 'Masque de gardien'], ['patins', 'Patins'], ['baton', 'Bâtons'], ['gants', 'Gants'],
    ['rondelle', 'Rondelle'], ['filet', 'Filet'], ['lumiere', 'Lumière de but'], ['coupe', 'Coupe'], ['ecusson', 'Écusson'], ['lys', 'Fleur de lys'], ['surfaceuse', 'Surfaceuse'], ['biere', 'Bière']];
  const sw = k => `<div class="swatches">${AV_PALETTE.map(c => `<button class="${a[k] === c ? 'on' : ''}" style="background:${c}" onclick="AVE.a.${k}='${c}';renderAvatarEditor()" aria-label="${c}"></button>`).join('')}</div>`;
  $('#sheetBody').innerHTML = `<h3>🎨 Logo de ${esc(t.name)}</h3>
    <div style="display:flex;justify-content:center;margin:6px 0 4px">${teamIcon(a, 120, t.name)}</div>
    <label class="f">Modèle · <span class="muted">${esc((types.find(x => x[0] === a.type) || [])[1] || '')}</span></label>
    <div class="avgrid">${types.map(([k, l]) => `<button class="${a.type === k ? 'on' : ''}" title="${l}" onclick="AVE.a.type='${k}';renderAvatarEditor()">${teamIcon({ ...a, type: k }, 44, t.name)}</button>`).join('')}</div>
    <label class="f">Couleur principale</label>${sw('c1')}
    <label class="f">Bandes</label>${sw('c2')}
    <label class="f">Détails</label>${sw('c3')}
    <label class="f">Lettres (chandail, masque, rondelle, écusson, surfaceuse · 2 max)</label>
    <input id="aveL" maxlength="2" value="${esc(a.letter || '')}" style="text-transform:uppercase;margin-bottom:12px" oninput="AVE.a.letter=this.value.toUpperCase();">
    <div class="row"><button class="btn ghost" onclick="AVE.a={...defaultAvatar('${esc(t.name).replace(/'/g, "\\'")}'),type:AVE.a.type};renderAvatarEditor()">Couleurs au hasard</button><button class="btn" onclick="saveAvatar()">Enregistrer</button></div>`;
}
const saveAvatar = run(async () => {
  AVE.a.letter = ($('#aveL').value || '').toUpperCase();
  await api('/api/team/avatar', { teamId: AVE.teamId, avatar: AVE.a });
  closeSheet(); toast('Logo enregistré'); await refresh();
});

const pct = v => v === null || v === undefined ? '—' : (v < 1 ? (v * 100).toFixed(1) : Number(v).toFixed(1)).replace('.', ',');
function playerCardHtml(p, owner, admin){
  const c = p.card || {}, goalie = p.pos === 'G', tc = TEAM_COLOR[c.team || p.nhl_team] || '#33475e';
  const logo = c.teamLogo || (p.nhl_team ? `https://assets.nhle.com/logos/nhl/svg/${p.nhl_team}_dark.svg` : '');
  const ppg = p.gp ? (p.pts / p.gp).toFixed(2).replace('.', ',') : '—';
  const rank = p.rank ? `<span>Rang ${p.pos} <b>${p.rank.pos_rank}/${p.rank.pos_total}</b></span><span>Total <b>${p.rank.all_rank}/${p.rank.all_total}</b></span>` : '';
  const initials = p.name.split(' ').map(x => x[0]).slice(0, 2).join('');
  const hero = `<div class="pc-hero" style="--tc:${tc}">
    ${logo ? `<img class="wm" src="${esc(logo)}" alt="" onerror="this.remove()">` : ''}
    <button class="pc-x" onclick="closeSheet()" aria-label="Fermer">✕</button>
    ${c.photo ? `<img class="pc-photo" src="${esc(c.photo)}" alt="" onerror="this.outerHTML='<div class=pc-noph>${esc(initials)}</div>'">` : `<div class="pc-noph">${esc(initials)}</div>`}
    <div class="pc-id"><div class="pc-name">${esc(p.name)}</div>
      <div class="pc-sub">${esc(c.teamName || p.nhl_team || '—')} · ${p.pos}${c.number !== null && c.number !== undefined ? ' · #' + c.number : ''}${p.injury ? injIcon(p.injury.dtd, 18) : ''}</div>
      <div class="pc-pills">${rank}<span>Pts pool <b>${p.pts ?? 0}</b></span><span>Pts/m <b>${ppg}</b></span>
        <span>${owner ? 'Chez <b>' + esc(owner.name) + '</b>' : '<b style="color:var(--green)">Agent libre</b>'}</span></div></div></div>`;

  // Boutons ronds (selon qui regarde).
  const act = (icon, label, on, cls = '') => `<button class="pc-act ${cls}" onclick="${on}"><i>${icon}</i>${label}</button>`;
  const acts = [];
  if (p.waiver) acts.push(p.waiver.mine ? act('↩', 'Retirer ma réclamation', `unclaimWaiver(${p.waiver.id})`, 'red') : act('⏳', 'Réclamer au ballottage', `openWaiverClaim(${p.waiver.id})`, 'go'));
  else if (!neutral()) {

function seasonTable(p, c, goalie){

// Matchs récents : détail de la LNH (tirs, temps de jeu) si on l'a, sinon nos matchs compilés ; toujours les points de pool.
function recentTable(p, c, goalie){
  const ours = new Map((p.recent || []).map(g => [String(g.date).slice(0, 10), g]));
  const nhl = (c.last5 || []);
  const rows = nhl.length ? nhl.map(g => ({ ...g, pool: (ours.get(String(g.date).slice(0, 10)) || {}).pts, result: (ours.get(String(g.date).slice(0, 10)) || {}).result }))
    : (p.recent || []).slice(0, 5).map(g => ({ date: g.date, opp: g.opp, home: g.home, goals: g.goals, assists: g.assists, points: g.goals + g.assists, pool: g.pts, result: g.result, decision: g.wins ? 'W' : g.ot_losses ? 'O' : null }));
  if (!rows.length) return '';
  const opp = g => `${g.home ? 'vs' : '@'} ${esc(g.opp || '?')}`;
  return `<h4>Matchs récents</h4><div class="pc-tw"><table class="pc-t">${goalie
    ? `<tr><th>Date</th><th>Adv.</th><th>Déc.</th><th>BA</th><th>%ARR</th><th>Pool</th></tr>${rows.map(g => `<tr><td>${frDay(g.date)}</td><td>${opp(g)}</td><td>${{ W: 'V', L: 'D', O: 'DP' }[g.decision] || '—'}</td><td>${g.ga ?? '—'}</td><td>${g.svPct !== undefined && g.svPct !== null ? pct(g.svPct) : '—'}</td><td><b>${g.pool ?? '—'}</b></td></tr>`).join('')}`
    : `<tr><th>Date</th><th>Adv.</th><th>B</th><th>A</th><th>Pts</th><th>+/-</th><th>Tirs</th><th>TG</th><th>Pool</th></tr>${rows.map(g => `<tr><td>${frDay(g.date)}</td><td>${opp(g)}</td><td>${g.goals ?? 0}</td><td>${g.assists ?? 0}</td><td><b>${g.points ?? 0}</b></td><td>${g.plusMinus ?? '—'}</td><td>${g.shots ?? '—'}</td><td>${g.toi || '—'}</td><td><b style="color:var(--gold)">${g.pool ?? '—'}</b></td></tr>`).join('')}`}</table></div>`;
}

function tradeCard(t){

  if (mineFrom && ['proposed','accepted'].includes(t.status)) acts.push(`<button class="btn small danger" onclick="tradeAct(${t.id},'cancel')">Annuler</button>`);

const vTrades = run(async () => {

  const done = list.filter(t => t.status === 'completed');

  const sec = (title, arr, empty) => `<h3 class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px">${title}${arr.length ? ' · ' + arr.length : ''}</h3>

  $('#view').innerHTML = `<h2 class="title">Échanges</h2>
    ${neutral() ? '<p class="muted">🔑 Compte commissaire : tu approuves les échanges. Pour proposer un échange avec ton équipe, connecte-toi avec le code de ton équipe.</p>' : `<button class="btn" style="width:100%" onclick="location.hash='#/offre'">⇄ Proposer un échange</button>`}
    <div class="row" style="margin-top:8px"><a class="btn ghost small" style="text-align:center;text-decoration:none" href="#/marche">📣 Marché des transactions${S.block.length ? ' · ' + S.block.length : ''}</a><a class="btn ghost small" style="text-align:center;text-decoration:none" href="#/choix">🎟️ Choix de repêchage</a></div>
    ${T.deadline ? `<p class="muted">Date limite des transactions : <b>${esc(T.deadline)} à 21 h</b>${T.deadlinePassed ? ' — <span style="color:var(--red)">passée</span>' : ''} (art. 5.1).</p>` : ''}
    <p class="muted">${T.approvalRequired ? 'Une fois acceptée par l\'autre pooler, l\'offre est approuvée par le commissaire.' : 'Une offre acceptée est complétée immédiatement.'}</p>
    ${waiverSection(W)}
    ${sec('À traiter', todo, 'Rien en attente.')}
    ${sec('Mes offres envoyées', sent, 'Aucune offre en cours.')}
    ${S.me.isAdmin ? sec('Négociations en cours (autres équipes)', pendingOthers, 'Aucune.') : ''}

const tradeAct = run(async (id, action) => {
  const labels = { accept:'Accepter cette offre ?', refuse:'Refuser cette offre ?', cancel:'Annuler ton offre ?', approve:'Approuver et compléter l\'échange ?', reject:'Rejeter cet échange ?' };
  if (!confirm(labels[action])) return;
  const reply = ['refuse','reject'].includes(action) ? (prompt('Un mot pour l\'autre pooler ? (optionnel)') || '') : '';
  await api(`/api/trades/${id}/${action}`, { reply });
  await loadState();
  const T = await api('/api/trades').catch(() => null), t = T && T.trades.find(x => x.id === id);
  // Acceptée mais pas encore complétée : les joueurs ne bougent qu'après l'approbation du commissaire.
  const pending = action === 'accept' && t && t.status === 'accepted';
  toast(pending ? '✅ Offre acceptée · en attente du commissaire : les joueurs changeront d\'équipe après son approbation'
    : { accept:'Échange complété : alignements mis à jour', refuse:'Offre refusée', cancel:'Offre annulée', approve:'Échange complété : alignements mis à jour', reject:'Échange rejeté' }[action]);
  vTrades();
});

// Montage d'une offre : deux plateaux, comme l'écran d'échange du jeu NHL.
let OF = null;
const vOffer = run(async (arg) => {
  if (neutral()) { toast('Le compte commissaire est neutre : connecte-toi avec ton équipe pour proposer un échange.'); location.hash = '#/echanges'; return; }
  const [partnerArg, counterArg, wantArg] = String(arg || '').split('-');
  const P = await api('/api/picks');
  let counter = null;
  if (counterArg) counter = (await api('/api/trades')).trades.find(t => t.id === Number(counterArg)) || null;
  const others = S.teams.filter(t => t.id !== S.me.teamId).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  OF = { partner: Number(partnerArg) || (others[0] && others[0].id), picks: P.picks, give: new Set(), get: new Set(), side: 'me', kind: 'players', counter, ret: {} };
  if (counter) {   // contre-offre : on part de l'offre reçue, vue de mon côté
    for (const i of counter.items) (i.from_team_id === S.me.teamId ? OF.give : OF.get).add(`${i.kind === 'player' ? 'p' : 'k'}${i.id}`);
  }
  if (wantArg) OF.get.add(wantArg);   // offre pour un joueur vu sur le marché
  renderOffer();
});
function offerAssets(teamId){
  const t = team(teamId);
  const players = ['F','D','G'].flatMap(pos => t.positions[pos].players);
  const picks = OF.picks.filter(p => p.owner_team_id === teamId && !p.used);
  return { t, players, picks };
}
function assetLabel(key){
  const id = Number(key.slice(1));
  if (key[0] === 'p') { const p = findPlayer(id); return p ? { text: esc(p.name), sub: `${p.pos} · ${money(p.aav)}` } : { text: '?', sub: '' }; }
  const k = OF.picks.find(x => x.id === id); return { text: '🎟️ ' + (k ? pickShort(k) : '?'), sub: '' };
}
function renderOffer(){
  const others = S.teams.filter(t => t.id !== S.me.teamId).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const me = offerAssets(S.me.teamId), them = offerAssets(OF.partner);
  const set = OF.side === 'me' ? OF.give : OF.get, src = OF.side === 'me' ? me : them;
  const tray = (title, keys, which) => `<div class="side"><h4>${title}</h4>${[...keys].map(k => { const a = assetLabel(k);
    const ret = which === 'me' && k[0] === 'p' ? `<select onclick="event.stopPropagation()" onchange="OF.ret['${k}']=Number(this.value);renderOffer()" title="Retenue de salaire (art. 5.3)"
        style="width:auto;padding:2px 4px;font-size:12px;margin-left:4px">${[0,10,20,25,30,40,50].map(v => `<option value="${v}" ${(OF.ret[k] || 0) === v ? 'selected' : ''}>${v ? 'ret. ' + v + ' %' : 'sans retenue'}</option>`).join('')}</select>` : '';
    return `<div class="it" onclick="offerToggle('${which}','${k}')"><span>${a.text}${ret}</span><span>${a.sub} ✕</span></div>`; }).join('') || '<div class="muted" style="font-size:12px">Touche un élément ci-dessous</div>'}</div>`;
  // Conformité après l'échange (mêmes règles que le serveur, sans les choix qui n'ont pas d'effet).
  const after = (teamId, outKeys, inKeys) => {
    const t = team(teamId);
    const outIds = new Set([...outKeys].filter(k => k[0] === 'p').map(k => Number(k.slice(1))));
    let players = ['F','D','G'].flatMap(pos => t.positions[pos].players).filter(p => !outIds.has(p.id));
    // Retenue : le joueur arrive à salaire réduit, et l'équipe qui l'envoie garde la différence.
    const retOf = k => { const p = findPlayer(Number(k.slice(1))); return Math.round((p.aav_full ?? p.aav ?? 0) * (OF.ret[k] || 0) / 100); };
    for (const k of inKeys) if (k[0] === 'p') { const p = findPlayer(Number(k.slice(1))); players.push(OF.ret[k] ? { ...p, aav: (p.aav || 0) - retOf(k) } : p); }
    const keep = [...outKeys].filter(k => k[0] === 'p' && OF.ret[k]).reduce((s2, k) => s2 + retOf(k), 0);
    const s = summarize(players, (t.retained || 0) + keep);
    return `<div class="impact ${s.issues.length ? 'issues' : 'okbox'}"><b>${esc(t.name)}</b> : masse ${money(t.capUsed)} → <b>${money(s.cap)}</b> · ${s.n.F} A, ${s.n.D} D, ${s.n.G} G
      ${s.issues.length ? '<br>⚠ ' + s.issues.join('<br>⚠ ') : ' ✓'}</div>`;
  };
  const list = OF.kind === 'players'
    ? src.players.map(p => { const k = 'p' + p.id; return `<div class="item ${set.has(k) ? 'sel' : ''}" onclick="offerToggle('${OF.side}','${k}')" style="${set.has(k) ? 'background:var(--warn-bg)' : ''}">
        <span class="pos pos-${p.pos}">${p.pos}</span><div class="grow"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.nhl_team || '')} · ${p.pts} pts · ${p.age ? p.age + ' ans · ' : ''}fin ${p.contract_end || '?'}</div></div>
        <div class="num"><span class="aav">${money(p.aav)}</span><div class="meta">${set.has(k) ? '✓ choisi' : '+'}</div></div></div>`; }).join('')
    : `<div class="chips" style="padding:6px 0">${src.picks.map(p => { const k = 'k' + p.id; return `<span class="chip ${set.has(k) ? 'sel' : ''}" style="cursor:pointer" onclick="offerToggle('${OF.side}','${k}')">${pickShort(p)}</span>`; }).join('') || '<span class="muted">Aucun choix disponible.</span>'}</div>`;
  $('#view').innerHTML = `<h2 class="title">${OF.counter ? 'Contre-offre' : 'Nouvelle offre'}</h2>
    <label class="f">Échanger avec</label>
    <select id="ofPartner" style="margin-bottom:12px" ${OF.counter ? 'disabled' : ''}>${others.map(t => `<option value="${t.id}" ${t.id === OF.partner ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
    <div class="tray">${tray('Tu envoies', OF.give, 'me')}${tray(`Tu reçois de ${esc(them.t.name)}`, OF.get, 'them')}</div>
    ${OF.give.size || OF.get.size ? after(S.me.teamId, OF.give, OF.get) + after(OF.partner, OF.get, OF.give) : ''}
    <div class="seg"><button class="${OF.side === 'me' ? 'on' : ''}" onclick="OF.side='me';renderOffer()">Mon équipe</button><button class="${OF.side === 'them' ? 'on' : ''}" onclick="OF.side='them';renderOffer()">${esc(them.t.name)}</button></div>
    <div class="seg"><button class="${OF.kind === 'players' ? 'on' : ''}" onclick="OF.kind='players';renderOffer()">Joueurs (${src.players.length})</button><button class="${OF.kind === 'picks' ? 'on' : ''}" onclick="OF.kind='picks';renderOffer()">Choix (${src.picks.length})</button></div>
    <div class="card"><div class="list">${list}</div></div>
    <textarea id="ofMsg" placeholder="Message pour ${esc(them.t.name)} (optionnel)" style="min-height:70px;font-family:inherit;font-size:15px">${esc(OF.msg || '')}</textarea>
    <div style="height:10px"></div>
    <button class="btn" style="width:100%" onclick="submitOffer()" ${OF.give.size || OF.get.size ? '' : 'disabled'}>Envoyer l'offre</button>
    <p class="muted">L'offre arrive dans l'onglet Échanges de ${esc(them.t.name)}. Un dépassement du plafond après un échange oblige à libérer un joueur (art. 3.2).</p>`;
  $('#ofPartner').onchange = e => { OF.partner = Number(e.target.value); OF.get.clear(); OF.side = 'them'; renderOffer(); };
  $('#ofMsg').oninput = e => { OF.msg = e.target.value; };
}
function offerToggle(which, key){ const s = which === 'me' ? OF.give : OF.get; s.has(key) ? s.delete(key) : s.add(key); renderOffer(); }
const submitOffer = run(async () => {
  const pick = (set, c) => [...set].filter(k => k[0] === c).map(k => Number(k.slice(1)));
  const body = { toTeamId: OF.partner, message: OF.msg || '', counterOf: OF.counter ? OF.counter.id : null,
    give: { players: pick(OF.give, 'p'), picks: pick(OF.give, 'k'),
      retain: Object.fromEntries(Object.entries(OF.ret).filter(([k, v]) => v && OF.give.has(k)).map(([k, v]) => [k.slice(1), v])) }, get: { players: pick(OF.get, 'p'), picks: pick(OF.get, 'k') } };
  if (!confirm(`Envoyer l'offre à ${team(OF.partner).name} ?`)) return;
  await api('/api/trades', body);
  toast('Offre envoyée'); location.hash = '#/echanges';
});

// Choix de repêchage : par équipe, par ronde, choix échangés (avec l'historique).
let picksTab = 'equipe', picksRound = 1;
const vPicks = run(async (teamArg) => {
  const P = await api('/api/picks');
  window._picks = P.picks;
  const years = [...new Set(P.picks.map(p => p.year))].sort();
  if (!years.includes(picksYear)) picksYear = years[0];
  const focus = Number(teamArg) || null;
  const teams = S.teams.slice().sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const tabs = [['equipe', 'Par équipe'], ['ronde', 'Par ronde'], ['echanges', 'Choix échangés']];
  let body = '';
  if (picksTab === 'equipe') {
    body = teams.filter(t => !focus || t.id === focus).map(t => `<div class="sechd">${teamAv(t, 30)} ${esc(t.name)}</div>${picksTable(P.picks, t.id)}`).join('');
  } else if (picksTab === 'ronde') {
    const rounds = [...new Set(P.picks.filter(p => p.year === picksYear).map(p => p.round))].sort((a, b) => a - b);
    const list = P.picks.filter(p => p.year === picksYear && p.round === picksRound);
    body = `<div class="seg" style="overflow-x:auto">${rounds.map(r => `<button class="${r === picksRound ? 'on' : ''}" onclick="picksRound=${r};vPicks(${focus || ''})">R${r}</button>`).join('')}</div>
      <div class="tblw"><table class="tbl"><tr><th>Appartient à</th><th>Propriétaire d'origine</th></tr>
      ${list.sort((a, b) => a.original_team.localeCompare(b.original_team, 'fr')).map(p => `<tr class="${p.used ? 'used' : ''}"><td>${tname(team(p.owner_team_id))}</td><td class="${p.owner_team_id !== p.original_team_id ? 'acq' : ''}">${p.owner_team_id !== p.original_team_id ? tname(team(p.original_team_id)) : '<span class="muted">—</span>'}</td></tr>`).join('')}</table></div>`;
  } else {

// ---------- Minuteur du repêchage (réel et simulation) ----------
// DCK.D : le repêchage affiché ; le temps restant se calcule à partir de l'échéance (heure du serveur).
const DCK = { D: null, offset: 0, lastSec: null, timer: null };
const redAt = c => Math.min(30, c.seconds / 4);
function clockLeft(D){
  const c = D && D.clock;
  if (!c || !D.current || !c.seconds) return null;
  if (c.paused) return c.left;
  if (!c.deadline) return c.seconds;
  return Math.max(0, (Date.parse(c.deadline) - Date.now() - DCK.offset) / 1000);
}
function draftClock(D){
  DCK.D = D; preloadDraftSounds();
  DCK.offset = D.clock && D.clock.serverNow && !D.sim ? Date.parse(D.clock.serverNow) - Date.now() : 0;
  if (!DCK.timer) DCK.timer = setInterval(draftClockTick, 200);
  draftClockTick();
}
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function draftClockTick(){
  const D = DCK.D, left = clockLeft(D);
  const box = $('#dclock'), mini = $('#dcMini');
  if (left === null || (!box && !mini)) return;
  const sec = Math.ceil(left), red = !D.clock.paused && left <= redAt(D.clock);
  for (const el of [$('#dcTime'), mini]) if (el) el.textContent = D.clock.paused ? '⏸ ' + mmss(sec) : mmss(sec);
  if (mini) mini.style.color = red ? 'var(--hot)' : '';
  const bar = $('#dcBar'); if (bar) bar.style.width = Math.max(0, Math.min(100, left / D.clock.seconds * 100)) + '%';
  if (box) { box.classList.toggle('red', red); box.classList.toggle('paused', !!D.clock.paused); }
  const cell = document.querySelector('table.db td.cur'); if (cell) cell.classList.toggle('red', red);
  // Tic-tac chaque seconde dans la zone rouge.
  if (red && sec !== DCK.lastSec && sec > 0) draftSound(sec % 2 ? 'tick' : 'tock');
  if (left <= 0 && !D.clock.paused && box) box.classList.add('red');
  if (left <= 0 && !D.clock.paused && !D.sim && DCK.buzzed !== D.current) { DCK.buzzed = D.current; draftSound('buzz'); }
  if (D.sim && left <= 0 && !D.clock.paused) simAdvance(null);
  DCK.lastSec = sec;
}
function clockBanner(D, mineId){
  const cur = D.picks.find(p => p.id === D.current); if (!cur) return '';
  const next = D.picks.find(p => !p.player && !p.used && !p.passed && !p.skipped && p.overall > cur.overall);
  const mine = cur.owner_team_id === mineId;
  const on = localStorageGet('pav_draft_sound') !== 'off';
  return `<div class="dclock ${mine ? 'mine' : ''}" id="dclock">
    <div><div class="k">${mine ? '⭐ À TON TOUR' : 'Au choix'} · ronde ${cur.round} · choix #${cur.overall}</div>
      <div class="tm">${esc(cur.owner_team)}${cur.owner_team_id !== cur.original_team_id ? ` <span class="sub">(choix de ${esc(cur.original_team)})</span>` : ''}</div>
      <div class="sub">${D.overtime ? '<b style="color:var(--hot)">⏱️ Temps écoulé · en attente du commissaire</b>' : next ? 'Ensuite : ' + esc(next.owner_team) : 'Dernier choix'}${D.warnings && D.warnings[cur.owner_team_id] ? ` · ⚠️ ${D.warnings[cur.owner_team_id]} avertissement${D.warnings[cur.owner_team_id] > 1 ? 's' : ''}` : ''}</div></div>
    <div><div class="time" id="dcTime">${D.clock && D.clock.seconds ? mmss(D.clock.seconds) : '∞'}</div>
      <button class="snd" onclick="toggleDraftSound(this)">${on ? '🔊' : '🔇'}</button></div>
    ${D.clock && D.clock.seconds ? '<div class="bar"><i id="dcBar"></i></div>' : ''}</div>`;
}
function toggleDraftSound(btn){
  const off = localStorageGet('pav_draft_sound') !== 'off';
  localStorageSet('pav_draft_sound', off ? 'off' : 'on'); btn.textContent = off ? '🔇' : '🔊';
  if (!off) draftSound('next');
}
// Sons du repêchage, synthétisés (aucun fichier à télécharger).
const DRAFT_SND = { tick: 'rep-tic', tock: 'rep-tac', next: 'rep-suivant', mine: 'rep-mon-tour', pick: 'rep-selection', buzz: 'rep-temps-ecoule', start: 'klaxon-but' };
function draftSound(kind){
  if (!audioCtx || localStorageGet('pav_draft_sound') === 'off' || !DRAFT_SND[kind]) return;
  if (kind === 'mine' && navigator.vibrate) navigator.vibrate([200, 100, 200]);
  playFile(DRAFT_SND[kind], kind === 'tick' || kind === 'tock' ? .55 : .9);
}
// Le tic-tac doit partir à la seconde près : on décode les sons du repêchage d'avance.
function preloadDraftSounds(){ if (audioCtx) Object.values(DRAFT_SND).forEach(f => sndBuffer(f).catch(() => {})); }
document.addEventListener('pointerdown', () => { if (location.hash.startsWith('#/repechage') || location.hash.startsWith('#/simulation')) preloadDraftSounds(); }, { passive: true });
// Compare deux états du repêchage pour jouer les sons et annoncer les sélections.
function draftEvents(prev, next, mineId){
  if (!prev || !next || prev.year !== next.year) return;
  if (prev.status !== 'live' && next.status === 'live') { draftSound('start'); return; }
  const was = id => prev.picks.find(x => x.id === id) || {};
  const picked = next.picks.filter(p => p.player && !was(p.id).player);
  const passed = next.picks.filter(p => p.passed && !was(p.id).passed);
  for (const p of picked) toast(`🎯 #${p.overall} ${p.owner_team} : ${p.player.name}`);
  if (picked.length) draftSound('pick'); else if (passed.length) toast(`⏭ Choix passé pour ${passed[0].owner_team}`);
  if (next.overtime && !prev.overtime) { const c = next.picks.find(p => p.id === next.current); if (c) toast(`⏱️ Temps écoulé pour ${c.owner_team}`); }
  if (next.current && next.current !== prev.current) {
    const cur = next.picks.find(p => p.id === next.current);
    setTimeout(() => draftSound(cur && cur.owner_team_id === mineId ? 'mine' : 'next'), picked.length || passed.length ? 1400 : 0);
    setTimeout(scrollToCurrent, 50);
  }
}
function scrollToCurrent(){
  const cell = document.querySelector('table.db td.cur'), wrap = document.querySelector('.boardwrap');
  if (cell && wrap) wrap.scrollTo({ left: Math.max(0, cell.offsetLeft - wrap.clientWidth / 2 + cell.offsetWidth / 2), top: Math.max(0, cell.offsetTop - 60), behavior: 'smooth' });
}
function shortName(n){ return n.length > 12 ? n.slice(0, 11) + '…' : n; }
function draftBoard(D, mineId = S.me.teamId){
  const cur = D.picks.find(p => p.id === D.current);
  const head = D.order.map((t, i) => `<th title="${esc(t.name)}"><span class="tname">${teamAvId(t.id, 18)}<span>${i + 1}. ${esc(shortName(t.name))}</span></span></th>`).join('');
  const rows = [];
  for (let r = 1; r <= D.rounds; r++) {
    const cells = D.order.map(t => {
      const p = D.picks.find(x => x.round === r && x.original_team_id === t.id);
      if (!p) return '<td></td>';
      const traded = p.owner_team_id !== p.original_team_id;
      const cls = [p.id === D.current ? 'cur' : '', p.owner_team_id === mineId ? 'mine' : '', (p.used && !p.player) || p.skipped ? 'gone' : '', p.passed ? 'passed' : ''].join(' ');
      const body = p.player ? `<b>${esc(p.player.name)}</b><small>${p.player.pos} · ${esc(p.player.nhl_team || '')}</small>`
        : p.used ? `<small>${esc(p.note || 'utilisé')}</small>`
        : p.passed ? '<small>⏱️ passé</small>'
        : p.skipped ? '<small>équipe complète</small>'
        : p.id === D.current ? '<small style="color:var(--gold);font-weight:700">⏳ au choix</small>' : `<small>#${p.overall}</small>`;
      return `<td class="${cls}" title="Choix #${p.overall}" ${p.passed && S.me.isAdmin && !D.sim ? `onclick="openDraftPicker(${p.id})"` : ''}>${body}${traded ? `<span class="own">→ ${esc(shortName(p.owner_team))}</span>` : ''}</td>`;
    }).join('');
    rows.push(`<tr><th class="r">R${r}</th>${cells}</tr>`);
  }
  return `<div class="boardwrap"><table class="db"><thead><tr><th class="r">#</th>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

const simStart = run(async () => {

// Ce que mes choix (simulés) changent à mon équipe : nombre par position, points des meilleurs (9 att., 4 déf., 2 gard.)
// et masse salariale (les 9/4/2 plus gros salaires, art. 3.1). Points de la saison en cours.
const SIM_COUNTED = { F: 9, D: 4, G: 2 };
function simFit(teamId, extra){
  const t = team(teamId), c = S.config, out = { pos: {}, ptsBefore: 0, ptsAfter: 0, capBefore: 0, capAfter: 0 };
  if (!t) return out;
  const top = (list, n, k) => list.map(p => Number(p[k]) || 0).sort((a, b) => b - a).slice(0, n).reduce((a, b) => a + b, 0);
  for (const pos of ['F', 'D', 'G']) {
    const P = t.positions[pos], mine = P.players, add = extra.filter(p => p.pos === pos), all = mine.concat(add), n = SIM_COUNTED[pos];
    const o = { before: mine.length, after: all.length, min: P.min, max: P.max, add,
      ptsBefore: top(mine, n, 'pts'), ptsAfter: top(all, n, 'pts'), capBefore: top(mine, n, 'aav'), capAfter: top(all, n, 'aav') };
    out.pos[pos] = o;
    out.ptsBefore += o.ptsBefore; out.ptsAfter += o.ptsAfter; out.capBefore += o.capBefore; out.capAfter += o.capAfter;
  }
  out.retained = t.retained || 0; out.cap = c.cap; out.floor = c.floor;
  out.sizeBefore = t.size; out.sizeAfter = t.size + extra.length;
  return out;
}
// Petit verdict pour un joueur de la liste : points ajoutés aux meilleurs, effet sur la masse, besoin à la position.
function simHint(p){
  const mine = simMine();
  const a = simFit(SIM.me, mine), b = simFit(SIM.me, mine.concat([p])), P = a.pos[p.pos];
  const gain = b.ptsAfter - a.ptsAfter, cap = b.capAfter + b.retained;
  const bits = [];
  if (P && P.after < P.min) bits.push(`<span style="color:var(--gold)">il te manque ${P.min - P.after} ${p.pos === 'F' ? 'att.' : p.pos === 'D' ? 'déf.' : 'gard.'}</span>`);
  if (P && P.after >= P.max) bits.push('<span style="color:var(--red)">position pleine</span>');
  bits.push(gain > 0 ? `<b style="color:var(--green)">+${gain} pts</b> à ton top ${SIM_COUNTED[p.pos]}` : '<span class="muted">ne change pas tes points (réserviste)</span>');
  if (cap > a.cap) bits.push('<span style="color:var(--red)">dépasse le plafond</span>');
  return bits.join(' · ');
}

function renderProtection(adminCard, statusTxt, season, mine){
  const D = PR.D, L = D.rules;
  const autoList = D.roster.filter(p => PR.auto.has(p.id));
  const combo = assignAuto(autoList);
  const rows = ['F','D','G'].map(pos => {
    const list = D.roster.filter(p => p.pos === pos).sort((a, b) => (b.aav || 0) - (a.aav || 0));
    return `<div class="card"><h3>${POS_LABEL[pos]}</h3><div class="list">${list.map(p => {
      const isP = PR.prot.has(p.id), isA = PR.auto.has(p.id);
      return `<div class="item" style="cursor:default;${isP ? 'background:var(--ok-bg)' : isA ? 'background:var(--warn-bg)' : ''}">
        <div class="grow"><div class="name">${esc(p.name)}</div>
          <div class="meta">${esc(p.nhl_team || '')} · ${p.gp} PJ · <span class="aav">${money(p.aav)}</span>${p.cats.length ? ' · ' + p.cats.map(c => `<span class="tag pts">${c}</span>`).join('') : ''}
          ${S.me.isAdmin ? ` <a class="link" style="font-size:11px" onclick="protOverride(${p.id})">⚙</a>` : ''}</div></div>
        ${mine && D.status === 'open' ? `<button class="btn small ${isP ? '' : 'ghost'}" onclick="protToggle('prot',${p.id})">🛡️</button>
        <button class="btn small ${isA ? '' : 'ghost'}" onclick="protToggle('auto',${p.id})" ${p.cats.length ? '' : 'disabled'}>⚡</button>` : (isP ? '🛡️' : isA ? '⚡' : '')}
      </div>`; }).join('')}</div></div>`;
  }).join('');
  const nP = PR.prot.size, nA = PR.auto.size;
  const problems = [];
  if (nP > L.protected) problems.push(`Trop de joueurs protégés : ${nP}/${L.protected}`);
  if (nA && !combo) problems.push('Combinaison automatique non permise (art. 4.3.4)');
  $('#view').innerHTML = `<h2 class="title">Liste de protection</h2>
    <p class="muted">Saison ${season} · ${statusTxt}. ${D.teamId !== S.me.teamId ? `Équipe : <b>${esc((team(D.teamId) || {}).name || '')}</b>.` : ''}
      ${D.submittedAt ? `<br>✓ Liste remise ${ago(D.submittedAt)} (modifiable jusqu'à la date limite).` : ''}</p>
    ${adminCard}
    <div class="stats">
      <div class="stat"><div class="l">🛡️ Protégés</div><div class="v" style="color:${nP > L.protected ? 'var(--red)' : 'inherit'}">${nP}/${L.protected}</div></div>
      <div class="stat"><div class="l">⚡ Automatiques</div><div class="v" style="color:${nA && !combo ? 'var(--red)' : 'inherit'}">${nA}/${L.auto}</div></div>
      <div class="stat"><div class="l">Libérés</div><div class="v">${D.roster.length - nP - nA}</div></div>
    </div>
    ${problems.length ? `<div class="issues">${problems.join('<br>')}</div>` : nA ? `<div class="okbox">Protections automatiques : ${autoList.map((p, i) => `${esc(p.name)} (${combo[i]})`).join(', ')}</div>` : ''}
    <details class="card"><summary>Règles (art. 4.3)</summary><p class="muted">
      <b>R</b> : recrue pendant la saison qui se termine · <b>GP</b> : attaquant/défenseur avec 39 matchs ou moins, gardien avec 20 ou moins ·
      <b>R2</b> : recrue la saison précédente (année supplémentaire). Au plus 3 automatiques : 3 R, 2 R + 1 R2, 1 R + 2 GP, ou 1 R + 1 GP + 1 R2.
      Recrue selon la LNH : moins de 26 ans au 15 septembre, jamais plus de 25 matchs en une saison, pas plus de 6 matchs dans chacune des deux saisons précédentes.</p></details>
    ${rows}
    ${mine && D.status === 'open' ? `<div class="row"><button class="btn ghost" onclick="protSave(false)">Enregistrer le brouillon</button>
      <button class="btn" onclick="protSave(true)" ${problems.length ? 'disabled' : ''}>Remettre ma liste</button></div>` : ''}`;
  window._prArgs = [adminCard, statusTxt, season, mine];
}
function assignAuto(list){
  if (list.length > 3) return null;
  const ok = a => { const n = c => a.filter(x => x === c).length; return n('R2') <= 1 && n('GP') <= 2 && n('GP') + n('R2') <= 2; };
  const walk = (i, acc) => { if (i === list.length) return ok(acc) ? acc : null; for (const c of list[i].cats) { const r = walk(i + 1, [...acc, c]); if (r) return r; } return null; };
  return walk(0, []);
}
function protToggle(which, id){
  const set = which === 'prot' ? PR.prot : PR.auto, other = which === 'prot' ? PR.auto : PR.prot;
  if (set.has(id)) set.delete(id); else { set.add(id); other.delete(id); }
  renderProtection(...window._prArgs);
}

const moveWatch = run(async (id, dir) => {
  const rows = window._watch; const p = rows.find(r => r.id === id);

  const order = ['F','D','G'].flatMap(pos => pos === p.pos ? same : rows.filter(r => r.pos === pos)).map(r => r.id);
  await api('/api/watchlist/reorder', { orderedPlayerIds: order }); vWatchlist();
});

function tradeMoves(){ return [...document.querySelectorAll('.trp:checked')].map(cb => ({ playerId: Number(cb.dataset.p), toTeamId: Number(cb.dataset.to) })); }
// Aperçu local de la conformité après l'échange (mêmes règles que le serveur).
function previewTrade(){
  const moves = tradeMoves(); const el = $('#trPreview');
  if (!moves.length) { el.innerHTML = ''; return; }
  const ids = [Number($('#trA').value), Number($('#trB').value)];
  el.innerHTML = ids.map(id => {
    const t = team(id);
    let players = ['F','D','G'].flatMap(pos => t.positions[pos].players);
    const outIds = new Set(moves.filter(m => m.toTeamId !== id).map(m => m.playerId));
    players = players.filter(p => !outIds.has(p.id));
    for (const m of moves.filter(m => m.toTeamId === id)) players.push(findPlayer(m.playerId));
    const s = summarize(players);
    return `<div class="${s.issues.length ? 'issues' : 'okbox'}"><b>${esc(t.name)} après l'échange</b> : masse ${money(s.cap)} · ${s.n.F} A, ${s.n.D} D, ${s.n.G} G
      ${s.issues.length ? '<br>⚠ ' + s.issues.join('<br>⚠ ') : ' ✓'}</div>`;
  }).join('');
}
function summarize(players, retained = 0){
  const MIN = { F:9, D:4, G:2 }, MAX = { F:18, D:8, G:4 };
  const n = { F:0, D:0, G:0 }; let cap = 0; const issues = [];
  for (const pos of ['F','D','G']) {
    const list = players.filter(p => p.pos === pos); n[pos] = list.length;
    cap += list.map(p => p.aav || 0).sort((a,b) => b - a).slice(0, MIN[pos]).reduce((s,v) => s + v, 0);
    if (n[pos] < MIN[pos]) issues.push(`${POS_LABEL[pos]} : ${n[pos]} (min ${MIN[pos]})`);
    if (n[pos] > MAX[pos]) issues.push(`${POS_LABEL[pos]} : ${n[pos]} (max ${MAX[pos]})`);
  }
  cap += retained;
  if (cap > S.config.cap) issues.push(`plafond dépassé de ${moneyFull(cap - S.config.cap)}`);
  if (S.config.floor && cap < S.config.floor) issues.push(`sous le plancher de ${moneyFull(S.config.floor - cap)}`);
  return { n, cap, issues };
}

// Mémoire des sons décodés (un seul téléchargement par son).
const SND = new Map();
function sndBuffer(file){
  if (!SND.has(file)) SND.set(file, fetch(`/sounds/${file}.mp3`).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(b => audioCtx.decodeAudioData(b)).catch(e => { SND.delete(file); throw e; }));
  return SND.get(file);
}
function playBuffer(buf, gain = .9){
  const src = audioCtx.createBufferSource(), g = audioCtx.createGain(); g.gain.value = gain;
  src.buffer = buf; src.connect(g); g.connect(audioCtx.destination); src.start();
}
async function playFile(file, gain = .9){
  if (!audioCtx) return;
  try { playBuffer(await sndBuffer(file), gain); } catch {}
}
function hornChoice(){
  const c = localStorageGet('pav_horn');
  if (c === 'perso' && S && S.config.hornVersion) return 'perso';
  if (c === 'moi' && localStorageGet('pav_horn_mine')) return 'moi';
  return HORNS[c] ? c : 'but';
}
// Mon son : un fichier de mon téléphone, gardé sur cet appareil seulement.
let myHorn = null;
async function goalHorn(choice){
  if (!audioCtx || localStorageGet('pav_sound') === 'off') return;
  if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 600]);
  const c = choice || hornChoice();
  if (c === 'perso' && hornBuffer) return playBuffer(hornBuffer);
  if (c === 'moi') {
    try {
      if (!myHorn) myHorn = await audioCtx.decodeAudioData(await (await fetch(localStorageGet('pav_horn_mine'))).arrayBuffer());
      return playBuffer(myHorn);
    } catch { myHorn = null; }
  }
  playFile((HORNS[c] || HORNS.but).file);
}

async function pollNotifications(){
  if (!S || document.hidden) return;
  try {
    const N = await api('/api/notifications?after=' + notifLast);
    const fresh = N.notifications.slice().reverse();
    if (fresh.length) {
      // Premier lancement sur cet appareil : on n'affiche pas tout l'historique d'un coup.
      const first = !notifLast;
      if (!first) { fresh.slice(-3).forEach(showBanner); S.unreadNotifications = (S.unreadNotifications || 0) + fresh.length; renderChrome(); }
      notifLast = fresh[fresh.length - 1].id; localStorageSet('pav_notif_last', String(notifLast));
    }
  } catch {}
}
function startNotifications(){ if (!notifTimer) notifTimer = setInterval(pollNotifications, 30000); pollNotifications(); syncPush().catch(() => {}); }
// À chaque connexion : le téléphone reste abonné, et au bon compte. Après un changement de compte (Face ID, commissaire)
// ou une réinstallation de l'application, l'abonnement est refait en silence si les notifications sont permises.
async function syncPush(){
  if (!('serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window) || Notification.permission !== 'granted') return;
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  const N = await api('/api/notifications?after=999999999');
  if (!N.publicKey) return;
  const st = sub ? await api('/api/push/status', { endpoint: sub.endpoint }) : { subscribed: false };
  if (st.subscribed && st.mine) return;
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(N.publicKey) });
  const kinds = st.subscribed ? st.kinds : Object.keys(N.kinds).filter(k => k !== 'admin' || S.me.isAdmin);
  await api('/api/push/subscribe', { subscription: sub.toJSON(), kinds });
}

// Vide le cache de l'application et recharge la dernière version.
async function reloadApp(){

// Nouvelle version de l'application : bandeau « Mettre à jour » (au lieu d'attendre la prochaine ouverture).

  el.style.cssText = 'position:fixed;left:10px;right:10px;bottom:calc(74px + var(--safe-b));z-index:65;max-width:540px;margin:0 auto';
  el.innerHTML = '<div class="ico">✨</div><div><div class="tt">Nouvelle version de l\'application</div><div class="bd">Touche ici pour la mettre à jour.</div></div>';
  el.onclick = () => reloadApp();
  document.body.appendChild(el);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'pav-update') showUpdateBanner(); });
  // La page vient d'ouvrir : le service worker a-t-il reçu une nouvelle version entre-temps ?
  const hello = () => { if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type: 'pav-hello' }); };
  setTimeout(hello, 2500); setTimeout(hello, 8000);
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) showUpdateBanner(); hadController = true; });
  // Au retour dans l'application, on vérifie s'il y a une mise à jour.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}); });
}
function urlB64(b64){ const p = '='.repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); }
async function renderPush(N, rebound){
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  const st = sub ? await api('/api/push/status', { endpoint: sub.endpoint }) : { subscribed: false, kinds: [] };
  if (sub && st.subscribed && !st.mine && !rebound) { await syncPush().catch(() => {}); return renderPush(N, true); }
  const on = sub && st.subscribed;
  const showKind = k => k !== 'admin' || S.me.isAdmin || st.alsoAdmin;
  const kinds = on ? st.kinds : Object.keys(N.kinds).filter(showKind);
  $('#pushBody').innerHTML = `
    <p class="muted">${on ? `✅ Les notifications sont activées sur ce téléphone, pour <b>${esc(myTeam() ? myTeam().name : '🔑 Commissaire')}</b>.` : 'Reçois les alertes même quand l\'application est fermée.'}</p>
    ${Object.entries(N.kinds).filter(([k]) => showKind(k)).map(([k, l]) => `<label class="pick"><input type="checkbox" class="pkind" value="${k}" ${kinds.includes(k) ? 'checked' : ''}> ${esc(l)}</label>`).join('')}
    <div class="row" style="margin-top:8px">
      <button class="btn small" id="pushOn">${on ? 'Enregistrer mes choix' : '🔔 Activer les notifications'}</button>
      ${on ? '<button class="btn small ghost" id="pushTest">Tester</button><button class="btn small danger" id="pushOff">Désactiver</button>' : ''}
    </div>`;
  $('#pushOn').onclick = run(async () => {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Notifications refusées dans les réglages du téléphone');
    const s2 = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(N.publicKey) });
    await api('/api/push/subscribe', { subscription: s2.toJSON(), kinds: [...document.querySelectorAll('.pkind:checked')].map(i => i.value) });
    toast('Notifications activées'); renderPush(N);
  });
  if (on) {
    $('#pushTest').onclick = run(async () => { await api('/api/push/test', { endpoint: sub.endpoint }); toast('Notification de test envoyée'); });
    $('#pushOff').onclick = run(async () => { await api('/api/push/unsubscribe', { endpoint: sub.endpoint }); await sub.unsubscribe(); toast('Notifications désactivées'); renderPush(N); });
  }
}
