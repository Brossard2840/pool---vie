<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pool à vie">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Pool à vie</title>
<style>
  :root{
    --ice:#0b1622; --panel:#121f2e; --panel-2:#182838; --line:#233648;
    --text:#dfe9f2; --dim:#8ea3b8; --gold:#c9a24b; --red:#e07466; --green:#5ba088;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  [hidden]{display:none !important;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--ice);color:var(--text);}
  body{min-height:100vh;padding-bottom:calc(64px + var(--safe-b));overscroll-behavior-y:none;}
  .top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0e1a28,#0b1622);border-bottom:1px solid var(--line);
       padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .brand{display:flex;align-items:center;gap:8px;min-width:0;}
  .brand .puck{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none;}
  .brand h1{font-size:15px;letter-spacing:.05em;margin:0;font-weight:800;}
  .brand .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top .me{font-size:12px;color:var(--dim);text-align:right;white-space:nowrap;}
  .top .me b{color:var(--gold);}
  main{padding:14px 16px;max-width:860px;margin:0 auto;}
  h2.title{font-size:20px;margin:4px 0 12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .card h3{font-size:12px;color:var(--dim);margin:0 0 10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px;}
  input,select,textarea{background:var(--ice);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;font-size:16px;width:100%;font-family:inherit;}
  textarea{font-family:ui-monospace,monospace;font-size:13px;min-height:140px;}
  label.f{display:block;font-size:12px;color:var(--dim);margin:0 0 4px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .row > *{flex:1;min-width:120px;}
  button{font-family:inherit;}
  .btn{background:var(--gold);color:#1a1408;border:none;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;}
  .btn.danger{background:transparent;border:1px solid var(--red);color:var(--red);}
  .btn.small{padding:7px 10px;font-size:13px;border-radius:8px;}
  .btn:disabled{opacity:.5;}
  .seg{display:flex;background:var(--ice);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px;}
  .seg button{flex:1;background:transparent;border:none;color:var(--dim);padding:8px 4px;border-radius:7px;font-size:13px;font-weight:600;}
  .seg button.on{background:var(--panel-2);color:var(--text);}
  .list{display:flex;flex-direction:column;}
  .item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #1a2938;cursor:pointer;}
  .item:last-child{border-bottom:none;}
  .item .grow{flex:1;min-width:0;}
  .item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .meta{font-size:12px;color:var(--dim);margin-top:2px;}
  .item .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .item .num b{font-size:17px;}
  .item.taken{opacity:.45;}
  .item.out .name{color:var(--dim);font-weight:500;}
  .rank{width:26px;height:26px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;}
  .rank.po{background:#2b2512;color:var(--gold);}
  .cutline{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;padding:6px 0;border-bottom:1px dashed var(--gold);margin-bottom:2px;}
  .pos{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;flex:none;}
  .pos-F{background:#2a3f2f;color:#8fd6a4;} .pos-D{background:#2a333f;color:#8fb4d6;} .pos-G{background:#3f2a2a;color:#d68f8f;}
  .aav{color:var(--gold);font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--dim);margin-left:4px;vertical-align:1px;}
  .tag.pts{border-color:var(--green);color:var(--green);} .tag.cap{border-color:var(--gold);color:var(--gold);}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;}
  .stat .l{font-size:11px;color:var(--dim);}
  .stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 2px;}
  .bar i{display:block;height:100%;background:var(--green);} .bar i.over{background:var(--red);}
  .issues{background:#2a1716;border:1px solid #5a2a26;color:#f0b3aa;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
  .okbox{background:#13261f;border:1px solid #24493b;color:#9fd8bf;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
  .muted{color:var(--dim);font-size:13px;}
  .empty{color:var(--dim);font-size:14px;padding:24px 8px;text-align:center;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(14,26,40,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);
          display:flex;padding-bottom:var(--safe-b);}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;color:var(--dim);text-decoration:none;font-size:10px;font-weight:600;position:relative;}
  .tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px;line-height:14px;}
  .tabbar a.on{color:var(--gold);}
  .tabbar svg{width:22px;height:22px;}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;
         border:1px solid var(--line);max-height:88vh;overflow:auto;padding:8px 16px calc(18px + var(--safe-b));transform:translateY(105%);transition:transform .22s,visibility .22s;visibility:hidden;}
  .sheet.open{transform:none;visibility:visible;} .sheet-bg.open{display:block;}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px;}
  .sheet h3{margin:0 0 4px;font-size:19px;}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0;}
  .kv div{background:var(--ice);border-radius:10px;padding:8px;text-align:center;}
  .kv .l{font-size:10px;color:var(--dim);text-transform:uppercase;} .kv .v{font-weight:800;font-size:16px;margin-top:2px;}
  .toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--gold);
         padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw;}
  .toast.show{opacity:1;}
  .code{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:.15em;color:var(--gold);font-weight:800;}
  .login{max-width:380px;margin:8vh auto 0;}
  .login .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 14px;}
  details summary{cursor:pointer;color:var(--dim);font-size:13px;}
  .pick{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1a2938;font-size:14px;}
  .pick input{width:20px;height:20px;flex:none;}
  a.link{color:var(--gold);text-decoration:none;font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--ice);font-variant-numeric:tabular-nums;}
  .chip.acq{border-color:var(--green);color:#9fd8bf;} .chip.used{opacity:.4;text-decoration:line-through;}
  .chip.sel{border-color:var(--gold);background:#2b2512;color:var(--gold);font-weight:700;}
  .tray{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .tray .side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:96px;}
  .tray .side h4{margin:0 0 6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;}
  .tray .it{font-size:13px;padding:4px 0;border-bottom:1px solid #1a2938;display:flex;justify-content:space-between;gap:6px;cursor:pointer;}
  .tray .it:last-child{border-bottom:none;}
  .tray .it span:last-child{color:var(--dim);white-space:nowrap;}
  .impact{font-size:12px;border-radius:10px;padding:8px 10px;margin-bottom:8px;}
  .trade{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel);}
  .trade .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-weight:700;}
  .pill{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;}
  .pill.wait{border-color:var(--gold);color:var(--gold);} .pill.ok{border-color:var(--green);color:var(--green);} .pill.no{border-color:var(--red);color:var(--red);}
  .trade .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;}
  .trade .cols h5{margin:0 0 4px;font-size:11px;color:var(--dim);font-weight:600;}
  .trade .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .datebar input{flex:1;text-align:center;padding:9px;}
  .games{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none;}
  .game{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;min-width:96px;font-variant-numeric:tabular-nums;}
  .game .t{display:flex;justify-content:space-between;gap:10px;font-weight:700;}
  .game .s{color:var(--dim);font-size:11px;margin-top:3px;}
  .game.live{border-color:var(--red);} .game.live .s{color:var(--red);font-weight:700;}
  .lt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
  .lt th{font-size:10px;color:var(--dim);font-weight:700;text-transform:uppercase;padding:6px 3px;text-align:right;}
  .lt th.grp{text-align:center;color:var(--gold);letter-spacing:.06em;border-bottom:1px dashed var(--gold);}
  .lt td{padding:10px 3px;text-align:right;border-top:1px solid #1a2938;}
  .lt td.n,.lt th.n{text-align:left;}
  .lt td.n{font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lt td.hot{background:#2b2512;color:var(--gold);font-weight:800;}
  .lt tr.me td.n{color:var(--gold);}
  .lt tr.lrow{cursor:pointer;}
  .lt tr.detail td{padding:0 3px 10px;text-align:left;border-top:none;}
  .lt .sep{border-left:1px solid var(--line);}
  .pl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:3px 0 3px 8px;}
  .pl b{color:var(--text);}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:4px;animation:pulse 1.4s infinite;}
  @keyframes pulse{50%{opacity:.25}}
</style>
</head>
<body>

<header class="top" id="top" hidden>
  <div class="brand"><span class="puck"></span><div><h1>POOL À VIE</h1><div class="sub" id="updated">—</div></div></div>
  <div class="me" id="meLabel"></div>
</header>

<main id="view"></main>

<nav class="tabbar" id="tabbar" hidden>
  <a href="#/classement" data-r="classement"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Classement</a>
  <a href="#/mon-equipe" data-r="mon-equipe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg>Mon équipe</a>
  <a href="#/direct" data-r="direct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>En direct</a>
  <a href="#/echanges" data-r="echanges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>Échanges<span class="badge" id="tradeBadge" hidden></span></a>
  <a href="#/joueurs" data-r="joueurs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Joueurs</a>
  <a href="#/plus" data-r="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Plus</a>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const POS_LABEL = { F: 'Attaquants', D: 'Défenseurs', G: 'Gardiens' };
let S = null;            // état de la ligue (/api/state)
let teamsCache = [];     // pour la page de connexion

// ---------- utilitaires ----------
const $ = sel => document.querySelector(sel);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ if (n === null || n === undefined) return '—'; return (n/1e6).toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:3}) + ' M$'; }
function moneyFull(n){ return Math.round(n).toLocaleString('fr-CA') + ' $'; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function ago(iso){
  if (!iso) return 'jamais';
  const m = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if (m < 1) return 'à l\'instant'; if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m/60); if (h < 24) return `il y a ${h} h`;
  return new Date(iso).toLocaleDateString('fr-CA');
}
function ppg(t){ return t.ppg.toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function statLine(p){
  if (p.pos === 'G') return `${p.gp} PJ · ${p.wins} V · ${p.ot_losses} DP · ${p.shutouts} BL`;
  return `${p.gp} PJ · ${p.goals} B · ${p.assists} A`;
}
async function api(path, body){
  const opts = body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  if (res.status === 401 && !path.startsWith('/api/login')) { S = null; showLogin(); throw new Error('Connexion requise'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
  return data;
}
async function apiDelete(path){
  const res = await fetch(path, { method:'DELETE' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
  return data;
}
function run(fn){ return async (...a) => { try { await fn(...a); } catch(e){ toast(e.message); } }; }
const team = id => S.teams.find(t => t.id === Number(id));
const myTeam = () => S && team(S.me.teamId);

// ---------- connexion ----------
async function showLogin(){
  $('#top').hidden = true; $('#tabbar').hidden = true;
  let loadError = '';
  teamsCache = await fetch('/api/login/teams').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(e => { loadError = e.message; return []; });
  const saved = localStorageGet('pav_team');
  $('#view').innerHTML = `
    <div class="login">
      <img class="logo" src="/icons/icon-192.png" alt="">
      <h2 class="title" style="text-align:center">Pool à vie</h2>
      <div class="card">
        <label class="f">Mon équipe</label>
        <select id="lgTeam">${teamsCache.map(t => `<option value="${t.id}" ${String(t.id)===saved?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
        <div style="height:10px"></div>
        <label class="f">Code d'accès</label>
        <input id="lgCode" autocomplete="current-password" autocapitalize="characters" placeholder="ex. K7PM2Q">
        <div style="height:14px"></div>
        <button class="btn" style="width:100%" id="lgGo">Entrer</button>
        ${loadError ? `<p class="muted" style="color:var(--red)">Le serveur ne répond pas (${esc(loadError)}). Réessaie dans 30 secondes.</p>`
          : teamsCache.length ? '' : '<p class="muted">Aucune équipe n\'a encore de code. Le commissaire doit définir COMMISSAIRE_CODE dans Render.</p>'}
      </div>
      <p class="muted" style="text-align:center">Ton code t'est remis par le commissaire.</p>
    </div>`;
  const go = run(async () => {
    const v = $('#lgTeam').value, teamId = v === 'admin' ? 'admin' : Number(v);
    await api('/api/login', { teamId, code: $('#lgCode').value });
    localStorageSet('pav_team', String(teamId));
    await boot();
  });
  $('#lgGo').onclick = go;
  $('#lgCode').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function localStorageGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v){ try { localStorage.setItem(k, v); } catch {} }

async function loadState(){ S = await api('/api/state'); renderChrome(); }
function renderChrome(){
  $('#top').hidden = false; $('#tabbar').hidden = false;
  const lastStats = [S.config.lastUpdate, S.config.lastLive].filter(Boolean).sort().pop();
  $('#updated').textContent = `Stats LNH : ${ago(lastStats)}`;
  $('#meLabel').innerHTML = `<b>${esc(S.me.name)}</b>${S.me.isAdmin ? '<br>commissaire' : ''}`;
  const b = $('#tradeBadge'); b.hidden = !S.pendingTrades; b.textContent = S.pendingTrades || '';
}
async function boot(){
  try { await loadState(); } catch { return; }
  route();
}

// ---------- routage ----------
window.addEventListener('hashchange', () => route());
function route(){
  if (!S) return;
  closeSheet();
  const [, r = 'classement', arg] = location.hash.split('/');
  document.querySelectorAll('.tabbar a').forEach(a => a.classList.toggle('on', a.dataset.r === r ||
    (r === 'equipe' && a.dataset.r === (Number(arg) === S.me.teamId ? 'mon-equipe' : 'classement')) ||
    (['liste','historique','commissaire','equipes'].includes(r) && a.dataset.r === 'plus') ||
    (['offre','choix'].includes(r) && a.dataset.r === 'echanges')));
  clearInterval(liveTimer); liveTimer = null;
  window.scrollTo(0, 0);
  const views = { classement: vStandings, 'mon-equipe': () => vTeam(S.me.teamId), equipe: () => vTeam(arg), equipes: vTeams, direct: () => vLive(arg),
                  echanges: vTrades, offre: () => vOffer(arg), choix: () => vPicks(arg),
                  joueurs: vPlayers, plus: vMore, liste: vWatchlist, historique: vMoves, commissaire: vAdmin };
  (views[r] || vStandings)();
}
async function refresh(){ await loadState(); route(); }

// ---------- Classement ----------
function vStandings(){
  const rows = S.teams.map(t => `
    ${t.rank === 9 ? '<div class="cutline">Ligne des séries (top 8)</div>' : ''}
    <div class="item" onclick="location.hash='#/equipe/${t.id}'">
      <div class="rank ${t.playoffs ? 'po' : ''}">${t.rank}</div>
      <div class="grow"><div class="name">${esc(t.name)}${t.id === S.me.teamId ? ' <span class="tag cap">moi</span>' : ''}</div>
        <div class="meta">${t.size} joueurs · ${ppg(t)} pt/match · ${money(t.capUsed)}${t.issues.length ? ' · <span style="color:var(--red)">⚠ ' + t.issues.length + '</span>' : ''}</div></div>
      <div class="num"><b>${t.points}</b><div class="meta">pts</div></div>
    </div>`).join('');
  $('#view').innerHTML = `
    <h2 class="title">Classement</h2>

function playerItem(p, { showFlags = false, showOwner = false } = {}){

// ---------- En direct ----------
let liveTimer = null, liveOpen = new Set();
const STATE_FR = { FUT:'À venir', PRE:'Avant-match', LIVE:'En cours', CRIT:'En cours', FINAL:'Final', OFF:'Final' };
function gameStatus(g){
  if (g.state === 'LIVE' || g.state === 'CRIT') {
    if (g.in_intermission) return `Entracte ${g.period || ''}`;
    const per = g.period_type === 'OT' ? 'Prol.' : g.period_type === 'SO' ? 'Fus.' : `${g.period || ''}e`;
    return `${per} ${g.clock || ''}`;
  }
  if (g.state === 'FUT' || g.state === 'PRE') return g.start_utc ? new Date(g.start_utc).toLocaleTimeString('fr-CA', { hour:'2-digit', minute:'2-digit' }) : STATE_FR[g.state];
  return g.period_type === 'OT' ? 'Final (prol.)' : g.period_type === 'SO' ? 'Final (fus.)' : 'Final';
}
function shiftDate(d, n){ const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
const fr2 = v => v.toLocaleString('fr-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const vLive = run(async (date) => {
  const first = !$('#liveWrap');
  if (first) $('#view').innerHTML = `<h2 class="title">En direct</h2><div id="liveWrap"><div class="empty">Chargement des matchs…</div></div>`;
  const L = await api('/api/live' + (date ? '?date=' + date : ''));
  if (!$('#liveWrap')) return;
  const isToday = L.date === L.today;
  const anyLive = L.games.some(g => g.state === 'LIVE' || g.state === 'CRIT');
  const games = L.games.map(g => `<div class="game ${g.state === 'LIVE' || g.state === 'CRIT' ? 'live' : ''}">
      <div class="t"><span>${esc(g.away)}</span><span>${g.away_score ?? ''}</span></div>
      <div class="t"><span>${esc(g.home)}</span><span>${g.home_score ?? ''}</span></div>
      <div class="s">${g.state === 'LIVE' || g.state === 'CRIT' ? '<span class="dot"></span>' : ''}${esc(gameStatus(g))}</div></div>`).join('');
  const rows = L.teams.map(t => {
    const open = liveOpen.has(t.id);
    const detail = open ? `<tr class="detail"><td colspan="9">${t.players.length ? t.players.map(p => `<div class="pl">
        <span><span class="pos pos-${p.pos}">${p.pos}</span> <b>${esc(p.name)}</b> · ${esc(p.team || '')}${p.state === 'LIVE' || p.state === 'CRIT' ? ' <span class="dot"></span>' : ''}</span>
        <span>${p.pos === 'G' ? `${p.wins ? 'V' : p.ot_losses ? 'DP' : '—'}${p.shutouts ? ' · BL' : ''}` : `${p.goals} B · ${p.assists} A`} · <b>${p.pts} pt${p.pts > 1 ? 's' : ''}</b></span></div>`).join('')
        : '<div class="pl">Aucun joueur n\'a encore joué.</div>'}</td></tr>` : '';
    return `<tr class="lrow ${t.id === S.me.teamId ? 'me' : ''}" onclick="toggleLive(${t.id})">
      <td class="n">${t.rank}. ${esc(t.name)}</td><td>${t.scheduled}</td>
      <td class="sep">${t.liveGp}</td><td class="hot">${t.livePts}</td><td>${fr2(t.liveAvg)}</td>
      <td class="sep">${t.cumGp}</td><td class="hot">${t.cumPts}</td><td>${fr2(t.cumAvg)}</td><td>${t.diff ? '+' + t.diff : '–'}</td></tr>${detail}`;
  }).join('');
  $('#liveWrap').innerHTML = `
    <div class="datebar">
      <button class="btn small ghost" onclick="location.hash='#/direct/${shiftDate(L.date, -1)}'">‹</button>
      <input type="date" id="liveDate" value="${L.date}" max="${L.today}">
      <button class="btn small ghost" onclick="location.hash='#/direct/${shiftDate(L.date, 1)}'" ${isToday ? 'disabled' : ''}>›</button>
    </div>
    ${L.games.length ? `<div class="games">${games}</div>` : '<p class="muted">Aucun match de la LNH cette journée.</p>'}
    ${L.ready ? '' : '<div class="issues">Premier chargement : le serveur récupère tous les matchs de la saison (quelques minutes). Les totaux se compléteront tout seuls.</div>'}
    <div class="card" style="padding:8px 8px 4px;overflow-x:auto">
      <table class="lt">
        <tr><th></th><th></th><th class="grp" colspan="3">${isToday ? 'Live' : 'Journée'}</th><th class="grp" colspan="4">Cumulatif</th></tr>
        <tr><th class="n">Poolers</th><th title="Joueurs dont l'équipe joue">📅</th><th class="sep">PJ</th><th>Tot</th><th>Moy</th><th class="sep">PJ</th><th>Tot</th><th>Moy</th><th>Dif</th></tr>
        ${rows}
      </table>
    </div>
    <p class="muted">📅 joueurs dont l'équipe joue · PJ/Tot/Moy de la journée : tous les joueurs de l'alignement ·
      Cumulatif : les 9 A, 4 D et 2 G qui comptent (art. 2.3), matchs en cours inclus. Touchez une équipe pour voir ses marqueurs.
      ${isToday ? `Mis à jour ${ago(L.lastLive)}${anyLive ? ', rafraîchi chaque minute' : ''}.` : ''}</p>`;
  $('#liveDate').onchange = e => { if (e.target.value) location.hash = '#/direct/' + e.target.value; };
  window._liveDate = L.date;
  if (isToday && !liveTimer) liveTimer = setInterval(() => { if (!document.hidden && $('#liveWrap')) vLive(); }, 60 * 1000);
});
function toggleLive(id){ liveOpen.has(id) ? liveOpen.delete(id) : liveOpen.add(id); vLive(window._liveDate); }

// ---------- Échanges ----------
const roundFr = r => r === 1 ? '1re' : `${r}e`;
function pickShort(p){ return `${p.year} · ${roundFr(p.round)}${p.original_team_id !== p.owner_team_id ? ' (' + esc(p.original_team) + ')' : ''}`; }
function picksChips(list){
  if (!list.length) return '<span class="muted">Aucun choix.</span>';
  return `<div class="chips">${list.map(p => `<span class="chip ${p.original_team_id !== p.owner_team_id ? 'acq' : ''} ${p.used ? 'used' : ''}"
    ${S.me.isAdmin ? `onclick="editPick(${p.id})" style="cursor:pointer"` : ''}>${pickShort(p)}</span>`).join('')}</div>`;
}
function tradeItems(list){
  return list.length ? list.map(i => `<div>${i.kind === 'player' ? `<span class="pos pos-${i.pos}">${i.pos}</span> ${esc(i.label)} <span class="aav">${money(i.aav)}</span>`
    : '🎟️ ' + esc(i.label.replace('Choix ', ''))}</div>`).join('') : '<div class="muted">—</div>';
}
function tradeCard(t){
  const mineFrom = t.from_team_id === S.me.teamId, mineTo = t.to_team_id === S.me.teamId;
  const cls = { proposed:'wait', accepted:'wait', completed:'ok' }[t.status] || 'no';
  const acts = [];
  if (mineTo && t.status === 'proposed') acts.push(`<button class="btn small" onclick="tradeAct(${t.id},'accept')">Accepter</button>`,
    `<button class="btn small ghost" onclick="location.hash='#/offre/${t.from_team_id}-${t.id}'">Contre-offre</button>`,
    `<button class="btn small danger" onclick="tradeAct(${t.id},'refuse')">Refuser</button>`);
  if (mineFrom && ['proposed','accepted'].includes(t.status)) acts.push(`<button class="btn small danger" onclick="tradeAct(${t.id},'cancel')">Annuler</button>`);
  if (S.me.isAdmin && t.status === 'accepted') acts.push(`<button class="btn small" onclick="tradeAct(${t.id},'approve')">✓ Approuver</button>`,
    `<button class="btn small danger" onclick="tradeAct(${t.id},'reject')">Rejeter</button>`);
  return `<div class="trade">
    <div class="hd"><span>${esc(t.from_team)} ⇄ ${esc(t.to_team)}</span><span class="pill ${cls}">${esc(t.status_label)}</span></div>
    <div class="cols">
      <div><h5>${esc(t.from_team)} envoie</h5>${tradeItems(t.items.filter(i => i.from_team_id === t.from_team_id))}</div>
      <div><h5>${esc(t.to_team)} envoie</h5>${tradeItems(t.items.filter(i => i.from_team_id === t.to_team_id))}</div>
    </div>
    ${t.message ? `<p class="muted" style="margin:8px 0 0">💬 ${esc(t.message)}</p>` : ''}
    ${t.reply ? `<p class="muted" style="margin:4px 0 0">↩︎ ${esc(t.reply)}</p>` : ''}
    <div class="meta muted" style="margin-top:6px;font-size:11px">#${t.id} · ${new Date(t.updated_at).toLocaleString('fr-CA', { dateStyle:'medium', timeStyle:'short' })}</div>
    ${acts.length ? `<div class="actions">${acts.join('')}</div>` : ''}
  </div>`;
}
const vTrades = run(async () => {
  const T = await api('/api/trades');
  const me = S.me.teamId, list = T.trades;
  const todo = list.filter(t => (t.to_team_id === me && t.status === 'proposed') || (S.me.isAdmin && t.status === 'accepted'));

  const closed = list.filter(t => ['refused','cancelled','rejected','expired'].includes(t.status) && (t.from_team_id === me || t.to_team_id === me || S.me.isAdmin));
  const sec = (title, arr, empty) => `<h3 class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px">${title}${arr.length ? ' · ' + arr.length : ''}</h3>
    ${arr.length ? arr.map(tradeCard).join('') : `<p class="muted">${empty}</p>`}`;
  $('#view').innerHTML = `<h2 class="title">Échanges</h2>
    <button class="btn" style="width:100%" onclick="location.hash='#/offre'">⇄ Proposer un échange</button>
    <div class="row" style="margin-top:8px"><a class="btn ghost small" style="text-align:center;text-decoration:none" href="#/choix">🎟️ Choix de repêchage</a></div>
    ${T.deadline ? `<p class="muted">Date limite des transactions : <b>${esc(T.deadline)} à 21 h</b>${T.deadlinePassed ? ' — <span style="color:var(--red)">passée</span>' : ''} (art. 5.1).</p>` : ''}

// Montage d'une offre : deux plateaux, comme l'écran d'échange du jeu NHL.
let OF = null;
const vOffer = run(async (arg) => {
  const [partnerArg, counterArg] = String(arg || '').split('-');
  const P = await api('/api/picks');
  let counter = null;
  if (counterArg) counter = (await api('/api/trades')).trades.find(t => t.id === Number(counterArg)) || null;
  const others = S.teams.filter(t => t.id !== S.me.teamId).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  OF = { partner: Number(partnerArg) || (others[0] && others[0].id), picks: P.picks, give: new Set(), get: new Set(), side: 'me', kind: 'players', counter };
  if (counter) {   // contre-offre : on part de l'offre reçue, vue de mon côté
    for (const i of counter.items) (i.from_team_id === S.me.teamId ? OF.give : OF.get).add(`${i.kind === 'player' ? 'p' : 'k'}${i.id}`);
  }
  renderOffer();
});
function offerAssets(teamId){
  const t = team(teamId);
  const players = ['F','D','G'].flatMap(pos => t.positions[pos].players);
  const picks = OF.picks.filter(p => p.owner_team_id === teamId && !p.used);
  return { t, players, picks };
}
function assetLabel(key){
  const id = Number(key.slice(1));
  if (key[0] === 'p') { const p = findPlayer(id); return p ? { text: esc(p.name), sub: `${p.pos} · ${money(p.aav)}` } : { text: '?', sub: '' }; }
  const k = OF.picks.find(x => x.id === id); return { text: '🎟️ ' + (k ? pickShort(k) : '?'), sub: '' };
}
function renderOffer(){
  const others = S.teams.filter(t => t.id !== S.me.teamId).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const me = offerAssets(S.me.teamId), them = offerAssets(OF.partner);
  const set = OF.side === 'me' ? OF.give : OF.get, src = OF.side === 'me' ? me : them;
  const tray = (title, keys, which) => `<div class="side"><h4>${title}</h4>${[...keys].map(k => { const a = assetLabel(k);
    return `<div class="it" onclick="offerToggle('${which}','${k}')"><span>${a.text}</span><span>${a.sub} ✕</span></div>`; }).join('') || '<div class="muted" style="font-size:12px">Touche un élément ci-dessous</div>'}</div>`;
  // Conformité après l'échange (mêmes règles que le serveur, sans les choix qui n'ont pas d'effet).
  const after = (teamId, outKeys, inKeys) => {
    const t = team(teamId);
    const outIds = new Set([...outKeys].filter(k => k[0] === 'p').map(k => Number(k.slice(1))));
    let players = ['F','D','G'].flatMap(pos => t.positions[pos].players).filter(p => !outIds.has(p.id));
    for (const k of inKeys) if (k[0] === 'p') players.push(findPlayer(Number(k.slice(1))));
    const s = summarize(players);
    return `<div class="impact ${s.issues.length ? 'issues' : 'okbox'}"><b>${esc(t.name)}</b> : masse ${money(t.capUsed)} → <b>${money(s.cap)}</b> · ${s.n.F} A, ${s.n.D} D, ${s.n.G} G
      ${s.issues.length ? '<br>⚠ ' + s.issues.join('<br>⚠ ') : ' ✓'}</div>`;
  };
  const list = OF.kind === 'players'
    ? src.players.map(p => { const k = 'p' + p.id; return `<div class="item ${set.has(k) ? 'sel' : ''}" onclick="offerToggle('${OF.side}','${k}')" style="${set.has(k) ? 'background:#2b2512' : ''}">
        <span class="pos pos-${p.pos}">${p.pos}</span><div class="grow"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.nhl_team || '')} · ${p.pts} pts · ${p.age ? p.age + ' ans · ' : ''}fin ${p.contract_end || '?'}</div></div>
        <div class="num"><span class="aav">${money(p.aav)}</span><div class="meta">${set.has(k) ? '✓ choisi' : '+'}</div></div></div>`; }).join('')
    : `<div class="chips" style="padding:6px 0">${src.picks.map(p => { const k = 'k' + p.id; return `<span class="chip ${set.has(k) ? 'sel' : ''}" style="cursor:pointer" onclick="offerToggle('${OF.side}','${k}')">${pickShort(p)}</span>`; }).join('') || '<span class="muted">Aucun choix disponible.</span>'}</div>`;
  $('#view').innerHTML = `<h2 class="title">${OF.counter ? 'Contre-offre' : 'Nouvelle offre'}</h2>
    <label class="f">Échanger avec</label>
    <select id="ofPartner" style="margin-bottom:12px" ${OF.counter ? 'disabled' : ''}>${others.map(t => `<option value="${t.id}" ${t.id === OF.partner ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
    <div class="tray">${tray('Tu envoies', OF.give, 'me')}${tray(`Tu reçois de ${esc(them.t.name)}`, OF.get, 'them')}</div>
    ${OF.give.size || OF.get.size ? after(S.me.teamId, OF.give, OF.get) + after(OF.partner, OF.get, OF.give) : ''}
    <div class="seg"><button class="${OF.side === 'me' ? 'on' : ''}" onclick="OF.side='me';renderOffer()">Mon équipe</button><button class="${OF.side === 'them' ? 'on' : ''}" onclick="OF.side='them';renderOffer()">${esc(them.t.name)}</button></div>
    <div class="seg"><button class="${OF.kind === 'players' ? 'on' : ''}" onclick="OF.kind='players';renderOffer()">Joueurs (${src.players.length})</button><button class="${OF.kind === 'picks' ? 'on' : ''}" onclick="OF.kind='picks';renderOffer()">Choix (${src.picks.length})</button></div>
    <div class="card"><div class="list">${list}</div></div>
    <textarea id="ofMsg" placeholder="Message pour ${esc(them.t.name)} (optionnel)" style="min-height:70px;font-family:inherit;font-size:15px">${esc(OF.msg || '')}</textarea>
    <div style="height:10px"></div>
    <button class="btn" style="width:100%" onclick="submitOffer()" ${OF.give.size || OF.get.size ? '' : 'disabled'}>Envoyer l'offre</button>
    <p class="muted">L'offre arrive dans l'onglet Échanges de ${esc(them.t.name)}. Un dépassement du plafond après un échange oblige à libérer un joueur (art. 3.2).</p>`;
  $('#ofPartner').onchange = e => { OF.partner = Number(e.target.value); OF.get.clear(); OF.side = 'them'; renderOffer(); };
  $('#ofMsg').oninput = e => { OF.msg = e.target.value; };
}
function offerToggle(which, key){ const s = which === 'me' ? OF.give : OF.get; s.has(key) ? s.delete(key) : s.add(key); renderOffer(); }
const submitOffer = run(async () => {
  const pick = (set, c) => [...set].filter(k => k[0] === c).map(k => Number(k.slice(1)));
  const body = { toTeamId: OF.partner, message: OF.msg || '', counterOf: OF.counter ? OF.counter.id : null,

  if (!confirm(`Envoyer l'offre à ${team(OF.partner).name} ?`)) return;
  await api('/api/trades', body);

});

const moveWatch = run(async (id, dir) => {
  const rows = window._watch; const p = rows.find(r => r.id === id);
  const same = rows.filter(r => r.pos === p.pos); const i = same.indexOf(p); const j = i + dir;
  if (j < 0 || j >= same.length) return;
  [same[i], same[j]] = [same[j], same[i]];
  const order = ['F','D','G'].flatMap(pos => pos === p.pos ? same : rows.filter(r => r.pos === pos)).map(r => r.id);
  await api('/api/watchlist/reorder', { orderedPlayerIds: order }); vWatchlist();
});

  $('#impFile').onchange = async e => {

    $('#impText').value = await f.text();
    toast(`${$('#impText').value.trim().split(/\n/).length} lignes chargées`);
  };
  $('#trA').onchange = $('#trB').onchange = renderTradeLists;
  api('/api/trades').then(T => { $('#trApproval').checked = T.approvalRequired; $('#trDeadline').value = T.deadline || ''; }).catch(() => {});
  renderTradeLists();
});

const newCode = run(async id => {
  const t = team(id) || { name: '' };
  if (!confirm(`Générer un nouveau code pour ${t.name} ? L'ancien ne fonctionnera plus.`)) return;
  const { code } = await api(`/api/admin/teams/${id}/code`, {});
  showCode(t.name, code);
  $(`#code-${id}`).innerHTML = 'Code actif';
});
function showCode(name, code){
  const msg = `Pool à vie : ton accès pour l'équipe ${name}\n${location.origin}\nCode : ${code}`;
  $('#sheetBody').innerHTML = `<h3>${esc(name)}</h3><p class="muted">Note ce code maintenant : il ne sera plus affiché.</p>
    <div class="code" style="margin:14px 0">${code}</div>
    <button class="btn" style="width:100%" id="shareCode">${navigator.share ? 'Envoyer au pooler' : 'Copier le message'}</button>`;
  $('#shareCode').onclick = run(async () => {
    if (navigator.share) await navigator.share({ text: msg }).catch(() => {});
    else { await navigator.clipboard.writeText(msg); toast('Copié'); }
  });
  $('#sheet').classList.add('open'); $('#sheetBg').classList.add('open');
}
const addTeam = run(async () => {
  const name = $('#newTeam').value.trim(); if (!name) return;
  const r = await api('/api/admin/teams', { name }); await loadState(); await vAdmin(); showCode(r.name, r.code);
});
const renameTeam = run(async id => {
  const t = team(id); const name = prompt('Nouveau nom', t ? t.name : ''); if (!name) return;
  await api(`/api/admin/teams/${id}/rename`, { name }); await refresh();
});
const deleteTeam = run(async id => {
  const t = team(id); if (!confirm(`Supprimer l'équipe ${t ? t.name : ''} ? Ses joueurs deviennent agents libres.`)) return;
  await apiDelete(`/api/admin/teams/${id}`); await refresh();
});
const refreshStats = run(async btn => {
  btn.disabled = true; btn.textContent = 'Mise à jour…';
  try { const r = await api('/api/admin/stats/refresh', {}); toast(`${r.nhlPlayers} joueurs LNH mis à jour`); await refresh(); }
  finally { btn.disabled = false; }
});
const saveTradeSettings = run(async () => {
  await api('/api/admin/trade-settings', { approval: $('#trApproval').checked, deadline: $('#trDeadline').value });
  toast('Réglages des échanges enregistrés');
});
const genPicks = run(async () => {
  const r = await api('/api/admin/picks/generate', { year: Number($('#pkYear').value) });
  toast(`${r.created} choix créés`);
});
const saveConfig = run(async () => {
  await api('/api/admin/config', { cap: $('#cfCap').value, floor: $('#cfFloor').value, seasonId: $('#cfSeason').value.trim() });
  toast('Réglages enregistrés'); await refresh();
});
const addPlayer = run(async () => {
  await api('/api/admin/players', { name: $('#npName').value, pos: $('#npPos').value, aav: $('#npAav').value, nhl_team: $('#npTeam').value.trim().toUpperCase() });
  toast('Joueur créé — assigne-le depuis l\'onglet Joueurs'); $('#npName').value = '';
});
const doImport = run(async btn => {
  const replace = $('#impReplace').checked;
  if (replace && !confirm('Remplacer TOUS les alignements par cette liste ?')) return;
  btn.disabled = true;
  try {
    const r = await api('/api/admin/roster/import', { text: $('#impText').value, replace });
    $('#impResult').innerHTML = `<div class="${r.ambiguous.length || r.skipped.length ? 'issues' : 'okbox'}" style="margin-top:10px">
      ${r.assigned} joueur(s) assigné(s) · ${r.created} créé(s) · ${r.updated} mis à jour${r.teamsAdded.length ? ' · nouvelles équipes : ' + r.teamsAdded.map(esc).join(', ') : ''}
      ${r.ambiguous.length ? '<br><b>Homonymes à préciser :</b><br>' + r.ambiguous.map(esc).join('<br>') : ''}
      ${r.skipped.length ? '<br><b>Lignes ignorées :</b><br>' + r.skipped.map(esc).join('<br>') : ''}</div>`;
    await loadState();
  } finally { btn.disabled = false; }
});

function renderTradeLists(){
  const a = team($('#trA').value), b = team($('#trB').value);
  const col = (t, other) => `<div><label class="f">${esc(t.name)} envoie à ${esc(other.name)}</label>${
    ['F','D','G'].flatMap(pos => t.positions[pos].players).map(p => `<label class="pick"><input type="checkbox" class="trp" data-p="${p.id}" data-to="${other.id}">
      <span class="pos pos-${p.pos}">${p.pos}</span> ${esc(p.name)} <span class="aav" style="margin-left:auto">${money(p.aav)}</span></label>`).join('')}</div>`;
  $('#trLists').innerHTML = a.id === b.id ? '<p class="muted">Choisis deux équipes différentes.</p>' : `${col(a,b)}<div style="height:12px"></div>${col(b,a)}`;
  document.querySelectorAll('.trp').forEach(cb => cb.onchange = previewTrade);
  previewTrade();
}
function tradeMoves(){ return [...document.querySelectorAll('.trp:checked')].map(cb => ({ playerId: Number(cb.dataset.p), toTeamId: Number(cb.dataset.to) })); }
// Aperçu local de la conformité après l'échange (mêmes règles que le serveur).
function previewTrade(){
  const moves = tradeMoves(); const el = $('#trPreview');
  if (!moves.length) { el.innerHTML = ''; return; }
  const ids = [Number($('#trA').value), Number($('#trB').value)];
  el.innerHTML = ids.map(id => {
    const t = team(id);
    let players = ['F','D','G'].flatMap(pos => t.positions[pos].players);
    const outIds = new Set(moves.filter(m => m.toTeamId !== id).map(m => m.playerId));
    players = players.filter(p => !outIds.has(p.id));
    for (const m of moves.filter(m => m.toTeamId === id)) players.push(findPlayer(m.playerId));
    const s = summarize(players);
    return `<div class="${s.issues.length ? 'issues' : 'okbox'}"><b>${esc(t.name)} après l'échange</b> : masse ${money(s.cap)} · ${s.n.F} A, ${s.n.D} D, ${s.n.G} G
      ${s.issues.length ? '<br>⚠ ' + s.issues.join('<br>⚠ ') : ' ✓'}</div>`;
  }).join('');
}
function summarize(players){
  const MIN = { F:9, D:4, G:2 }, MAX = { F:18, D:8, G:4 };
  const n = { F:0, D:0, G:0 }; let cap = 0; const issues = [];
  for (const pos of ['F','D','G']) {
    const list = players.filter(p => p.pos === pos); n[pos] = list.length;
    cap += list.map(p => p.aav || 0).sort((a,b) => b - a).slice(0, MIN[pos]).reduce((s,v) => s + v, 0);
    if (n[pos] < MIN[pos]) issues.push(`${POS_LABEL[pos]} : ${n[pos]} (min ${MIN[pos]})`);
    if (n[pos] > MAX[pos]) issues.push(`${POS_LABEL[pos]} : ${n[pos]} (max ${MAX[pos]})`);
  }
  if (cap > S.config.cap) issues.push(`plafond dépassé de ${moneyFull(cap - S.config.cap)}`);
  if (S.config.floor && cap < S.config.floor) issues.push(`sous le plancher de ${moneyFull(S.config.floor - cap)}`);
  return { n, cap, issues };
}
const doTrade = run(async () => {
  const moves = tradeMoves(); if (!moves.length) return toast('Coche au moins un joueur');
  if (!confirm(`Enregistrer l'échange (${moves.length} joueur(s)) ?`)) return;
  await api('/api/admin/trade', { moves, note: $('#trNote').value });
  toast('Échange enregistré'); await loadState(); vAdmin();
});

// ---------- installation (PWA) ----------
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const b = $('#installBtn'); if (b) b.hidden = false; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

// Rafraîchit les données quand on revient dans l'application.
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && !$('#sheet').classList.contains('open')) refresh().catch(() => {}); });

boot();
</script>
</body>
