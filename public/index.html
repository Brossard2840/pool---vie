<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pool à vie">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Pool à vie</title>
<style>
  :root{
    --ice:#0b1622; --panel:#121f2e; --panel-2:#182838; --line:#233648;
    --text:#dfe9f2; --dim:#8ea3b8; --gold:#c9a24b; --red:#e07466; --green:#5ba088;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--ice);color:var(--text);}
  body{min-height:100vh;padding-bottom:calc(64px + var(--safe-b));overscroll-behavior-y:none;}
  .top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0e1a28,#0b1622);border-bottom:1px solid var(--line);
       padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .brand{display:flex;align-items:center;gap:8px;min-width:0;}
  .brand .puck{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none;}
  .brand h1{font-size:15px;letter-spacing:.05em;margin:0;font-weight:800;}
  .brand .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top .me{font-size:12px;color:var(--dim);text-align:right;white-space:nowrap;}
  .top .me b{color:var(--gold);}
  main{padding:14px 16px;max-width:860px;margin:0 auto;}
  h2.title{font-size:20px;margin:4px 0 12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .card h3{font-size:12px;color:var(--dim);margin:0 0 10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px;}
  input,select,textarea{background:var(--ice);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;font-size:16px;width:100%;font-family:inherit;}
  textarea{font-family:ui-monospace,monospace;font-size:13px;min-height:140px;}
  label.f{display:block;font-size:12px;color:var(--dim);margin:0 0 4px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .row > *{flex:1;min-width:120px;}
  button{font-family:inherit;}
  .btn{background:var(--gold);color:#1a1408;border:none;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;}
  .btn.danger{background:transparent;border:1px solid var(--red);color:var(--red);}
  .btn.small{padding:7px 10px;font-size:13px;border-radius:8px;}
  .btn:disabled{opacity:.5;}
  .seg{display:flex;background:var(--ice);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px;}
  .seg button{flex:1;background:transparent;border:none;color:var(--dim);padding:8px 4px;border-radius:7px;font-size:13px;font-weight:600;}
  .seg button.on{background:var(--panel-2);color:var(--text);}
  .list{display:flex;flex-direction:column;}
  .item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #1a2938;cursor:pointer;}
  .item:last-child{border-bottom:none;}
  .item .grow{flex:1;min-width:0;}
  .item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .meta{font-size:12px;color:var(--dim);margin-top:2px;}
  .item .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .item .num b{font-size:17px;}
  .item.taken{opacity:.45;}
  .item.out .name{color:var(--dim);font-weight:500;}
  .rank{width:26px;height:26px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;}
  .rank.po{background:#2b2512;color:var(--gold);}
  .cutline{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;padding:6px 0;border-bottom:1px dashed var(--gold);margin-bottom:2px;}
  .pos{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;flex:none;}
  .pos-F{background:#2a3f2f;color:#8fd6a4;} .pos-D{background:#2a333f;color:#8fb4d6;} .pos-G{background:#3f2a2a;color:#d68f8f;}
  .aav{color:var(--gold);font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--dim);margin-left:4px;vertical-align:1px;}
  .tag.pts{border-color:var(--green);color:var(--green);} .tag.cap{border-color:var(--gold);color:var(--gold);}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;}
  .stat .l{font-size:11px;color:var(--dim);}
  .stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 2px;}
  .bar i{display:block;height:100%;background:var(--green);} .bar i.over{background:var(--red);}
  .issues{background:#2a1716;border:1px solid #5a2a26;color:#f0b3aa;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
  .okbox{background:#13261f;border:1px solid #24493b;color:#9fd8bf;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
  .muted{color:var(--dim);font-size:13px;}
  .empty{color:var(--dim);font-size:14px;padding:24px 8px;text-align:center;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(14,26,40,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);
          display:flex;padding-bottom:var(--safe-b);}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;color:var(--dim);text-decoration:none;font-size:11px;font-weight:600;}
  .tabbar a.on{color:var(--gold);}
  .tabbar svg{width:22px;height:22px;}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;
         border:1px solid var(--line);max-height:88vh;overflow:auto;padding:8px 16px calc(18px + var(--safe-b));transform:translateY(105%);transition:transform .22s,visibility .22s;visibility:hidden;}
  .sheet.open{transform:none;visibility:visible;} .sheet-bg.open{display:block;}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px;}
  .sheet h3{margin:0 0 4px;font-size:19px;}
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0;}
  .kv div{background:var(--ice);border-radius:10px;padding:8px;text-align:center;}
  .kv .l{font-size:10px;color:var(--dim);text-transform:uppercase;} .kv .v{font-weight:800;font-size:16px;margin-top:2px;}
  .toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--gold);
         padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw;}
  .toast.show{opacity:1;}
  .code{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:.15em;color:var(--gold);font-weight:800;}
  .login{max-width:380px;margin:8vh auto 0;}
  .login .logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 14px;}
  details summary{cursor:pointer;color:var(--dim);font-size:13px;}
  .pick{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1a2938;font-size:14px;}
  .pick input{width:20px;height:20px;flex:none;}
  a.link{color:var(--gold);}
</style>
</head>
<body>

<header class="top" id="top" hidden>
  <div class="brand"><span class="puck"></span><div><h1>POOL À VIE</h1><div class="sub" id="updated">—</div></div></div>
  <div class="me" id="meLabel"></div>
</header>

<main id="view"></main>

<nav class="tabbar" id="tabbar" hidden>
  <a href="#/classement" data-r="classement"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Classement</a>
  <a href="#/mon-equipe" data-r="mon-equipe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg>Mon équipe</a>
  <a href="#/equipes" data-r="equipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 14.5c3 0 6 2 6 5.5"/></svg>Équipes</a>
  <a href="#/joueurs" data-r="joueurs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Joueurs</a>
  <a href="#/plus" data-r="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Plus</a>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const POS_LABEL = { F: 'Attaquants', D: 'Défenseurs', G: 'Gardiens' };
let S = null;            // état de la ligue (/api/state)
let teamsCache = [];     // pour la page de connexion

// ---------- utilitaires ----------
const $ = sel => document.querySelector(sel);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ if (n === null || n === undefined) return '—'; return (n/1e6).toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:3}) + ' M$'; }
function moneyFull(n){ return Math.round(n).toLocaleString('fr-CA') + ' $'; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function ago(iso){
  if (!iso) return 'jamais';
  const m = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if (m < 1) return 'à l\'instant'; if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m/60); if (h < 24) return `il y a ${h} h`;
  return new Date(iso).toLocaleDateString('fr-CA');
}
function ppg(t){ return t.ppg.toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function statLine(p){
  if (p.pos === 'G') return `${p.gp} PJ · ${p.wins} V · ${p.ot_losses} DP · ${p.shutouts} BL`;
  return `${p.gp} PJ · ${p.goals} B · ${p.assists} A`;
}
async function api(path, body){
  const opts = body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  if (res.status === 401 && !path.startsWith('/api/login')) { S = null; showLogin(); throw new Error('Connexion requise'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
  return data;
}
async function apiDelete(path){
  const res = await fetch(path, { method:'DELETE' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
  return data;
}
function run(fn){ return async (...a) => { try { await fn(...a); } catch(e){ toast(e.message); } }; }
const team = id => S.teams.find(t => t.id === Number(id));
const myTeam = () => S && team(S.me.teamId);

// ---------- connexion ----------
async function showLogin(){
  $('#top').hidden = true; $('#tabbar').hidden = true;
  teamsCache = await fetch('/api/login/teams').then(r => r.json()).catch(() => []);
  const saved = localStorageGet('pav_team');
  $('#view').innerHTML = `
    <div class="login">
      <img class="logo" src="/icons/icon-192.png" alt="">
      <h2 class="title" style="text-align:center">Pool à vie</h2>
      <div class="card">
        <label class="f">Mon équipe</label>
        <select id="lgTeam">${teamsCache.map(t => `<option value="${t.id}" ${String(t.id)===saved?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
        <div style="height:10px"></div>
        <label class="f">Code d'accès</label>
        <input id="lgCode" autocomplete="current-password" autocapitalize="characters" placeholder="ex. K7PM2Q">
        <div style="height:14px"></div>
        <button class="btn" style="width:100%" id="lgGo">Entrer</button>
        ${teamsCache.length ? '' : '<p class="muted">Aucune équipe n\'a encore de code. Le commissaire doit d\'abord se connecter.</p>'}
      </div>
      <p class="muted" style="text-align:center">Ton code t'est remis par le commissaire.</p>
    </div>`;
  const go = run(async () => {
    const teamId = Number($('#lgTeam').value);
    await api('/api/login', { teamId, code: $('#lgCode').value });
    localStorageSet('pav_team', String(teamId));
    await boot();
  });
  $('#lgGo').onclick = go;
  $('#lgCode').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function localStorageGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v){ try { localStorage.setItem(k, v); } catch {} }

async function loadState(){ S = await api('/api/state'); renderChrome(); }
function renderChrome(){
  $('#top').hidden = false; $('#tabbar').hidden = false;
  $('#updated').textContent = `Stats LNH : ${ago(S.config.lastUpdate)}`;
  $('#meLabel').innerHTML = `<b>${esc(S.me.name)}</b>${S.me.isAdmin ? '<br>commissaire' : ''}`;
}
async function boot(){
  try { await loadState(); } catch { return; }
  route();
}

// ---------- routage ----------
window.addEventListener('hashchange', () => route());
function route(){
  if (!S) return;
  closeSheet();
  const [, r = 'classement', arg] = location.hash.split('/');
  document.querySelectorAll('.tabbar a').forEach(a => a.classList.toggle('on', a.dataset.r === r ||
    (r === 'equipe' && a.dataset.r === (Number(arg) === S.me.teamId ? 'mon-equipe' : 'equipes')) ||
    (['liste','historique','commissaire'].includes(r) && a.dataset.r === 'plus')));
  window.scrollTo(0, 0);
  const views = { classement: vStandings, 'mon-equipe': () => vTeam(S.me.teamId), equipe: () => vTeam(arg), equipes: vTeams,
                  joueurs: vPlayers, plus: vMore, liste: vWatchlist, historique: vMoves, commissaire: vAdmin };
  (views[r] || vStandings)();
}
async function refresh(){ await loadState(); route(); }

// ---------- Classement ----------
function vStandings(){
  const rows = S.teams.map(t => `
    ${t.rank === 9 ? '<div class="cutline">Ligne des séries (top 8)</div>' : ''}
    <div class="item" onclick="location.hash='#/equipe/${t.id}'">
      <div class="rank ${t.playoffs ? 'po' : ''}">${t.rank}</div>
      <div class="grow"><div class="name">${esc(t.name)}${t.id === S.me.teamId ? ' <span class="tag cap">moi</span>' : ''}</div>
        <div class="meta">${t.size} joueurs · ${ppg(t)} pt/match · ${money(t.capUsed)}${t.issues.length ? ' · <span style="color:var(--red)">⚠ ' + t.issues.length + '</span>' : ''}</div></div>
      <div class="num"><b>${t.points}</b><div class="meta">pts</div></div>
    </div>`).join('');
  $('#view').innerHTML = `
    <h2 class="title">Classement</h2>
    <div class="card"><div class="list">${rows || '<div class="empty">Aucune équipe.</div>'}</div></div>
    <p class="muted">Seuls les 9 meilleurs attaquants, 4 meilleurs défenseurs et 2 meilleurs gardiens de chaque équipe comptent (art. 2.3).
    Égalité : points par match, puis buts (art. 6.2). Stats officielles de la LNH, mises à jour aux ${S.config.refreshMinutes} minutes.</p>`;
}

// ---------- Équipe ----------
function vTeam(id){
  const t = team(id);
  if (!t) { $('#view').innerHTML = '<div class="empty">Équipe introuvable.</div>'; return; }
  const c = S.config, pct = Math.min(100, t.capUsed / c.cap * 100);
  const sections = ['F','D','G'].map(pos => {
    const P = t.positions[pos];
    const items = P.players.map(p => playerItem(p, { showFlags: true })).join('');
    return `<div class="card">
      <h3><span>${POS_LABEL[pos]} · ${P.count} <span style="font-weight:500">(min ${P.min}, max ${P.max})</span></span>
          <span title="Salaire maximal qu'on peut ajouter à cette position sans dépasser le plafond">max ${money(Math.max(0, P.maxNewSalary))}</span></h3>
      <div class="list">${items || '<div class="empty">Aucun joueur</div>'}</div></div>`;
  }).join('');
  $('#view').innerHTML = `
    <h2 class="title">${esc(t.name)}</h2>
    <div class="stats">
      <div class="stat"><div class="l">Rang</div><div class="v">${t.rank}<span class="muted">/${S.teams.length}</span></div></div>
      <div class="stat"><div class="l">Points</div><div class="v">${t.points}</div></div>
      <div class="stat"><div class="l">Pt/match</div><div class="v">${ppg(t)}</div></div>
    </div>
    <div class="card">
      <h3><span>Masse salariale</span><span>${money(t.capUsed)} / ${money(c.cap)}</span></h3>
      <div class="bar"><i class="${t.capUsed > c.cap ? 'over' : ''}" style="width:${pct}%"></i></div>
      <div class="muted">Espace : <b style="color:${t.capSpace < 0 ? 'var(--red)' : 'var(--text)'}">${moneyFull(t.capSpace)}</b> · plancher ${money(c.floor)}</div>
    </div>
    ${t.issues.length ? `<div class="issues"><b>À corriger</b><br>${t.issues.map(esc).join('<br>')}</div>`
                      : '<div class="okbox">✓ Alignement conforme (positions, plafond et plancher)</div>'}
    ${sections}
    <p class="muted"><span class="tag pts">PTS</span> compte pour les points · <span class="tag cap">$</span> compte dans la masse salariale (art. 3.1)</p>`;
}

function playerItem(p, { showFlags = false, showOwner = false } = {}){
  const flags = showFlags ? `${p.counts_points ? '<span class="tag pts">PTS</span>' : ''}${p.counts_cap ? '<span class="tag cap">$</span>' : ''}` : '';
  const owner = showOwner ? (p.team ? ` · <b>${esc(p.team)}</b>` : ' · <span style="color:var(--green)">disponible</span>') : '';
  const link = p.nhl_id ? '' : ' · <span style="color:var(--red)">sans fiche LNH</span>';
  return `<div class="item ${showFlags && !p.counts_points ? 'out' : ''}" onclick="openPlayer(${p.id})">
    <span class="pos pos-${p.pos}">${p.pos}</span>
    <div class="grow"><div class="name">${esc(p.name)}${flags}${p.rookie ? '<span class="tag">R</span>' : ''}</div>
      <div class="meta">${esc(p.nhl_team || '—')} · ${statLine(p)}${owner}${link}</div></div>
    <div class="num"><b>${p.pts}</b><div class="meta aav">${money(p.aav)}</div></div>
  </div>`;
}

// ---------- Équipes ----------
function vTeams(){
  $('#view').innerHTML = `<h2 class="title">Équipes</h2><div class="card"><div class="list">${
    S.teams.slice().sort((a,b) => a.name.localeCompare(b.name, 'fr')).map(t => `
      <div class="item" onclick="location.hash='#/equipe/${t.id}'">
        <div class="grow"><div class="name">${esc(t.name)}</div>
          <div class="meta">${t.positions.F.count} A · ${t.positions.D.count} D · ${t.positions.G.count} G · espace ${money(t.capSpace)}
          ${t.issues.length ? ' · <span style="color:var(--red)">⚠ ' + t.issues.map(esc).join(', ') + '</span>' : ''}</div></div>
        <div class="num"><b>${t.points}</b><div class="meta">${t.rank}e</div></div>
      </div>`).join('')}</div></div>`;
}

// ---------- Joueurs ----------
const PF = { q:'', pos:'', status:'available', sort:'pts' };
function vPlayers(){
  const seg = (key, opts) => `<div class="seg">${opts.map(([v,l]) => `<button class="${PF[key]===v?'on':''}" onclick="PF.${key}='${v}';vPlayers()">${l}</button>`).join('')}</div>`;
  $('#view').innerHTML = `
    <h2 class="title">Joueurs LNH</h2>
    <input id="pq" type="search" placeholder="Rechercher un joueur…" value="${esc(PF.q)}" style="margin-bottom:10px">
    ${seg('status', [['available','Disponibles'],['owned','Possédés'],['all','Tous']])}
    ${seg('pos', [['','Toutes'],['F','Att.'],['D','Déf.'],['G','Gard.']])}
    ${seg('sort', [['pts','Points'],['aav','Salaire'],['age','Âge']])}
    <div class="card"><div class="list" id="plist"><div class="empty">Chargement…</div></div></div>`;

function renderTradeLists(){
  const a = team($('#trA').value), b = team($('#trB').value);
  const col = (t, other) => `<div><label class="f">${esc(t.name)} envoie à ${esc(other.name)}</label>${

      <span class="pos pos-${p.pos}">${p.pos}</span> ${esc(p.name)} <span class="aav" style="margin-left:auto">${money(p.aav)}</span></label>`).join('')}</div>`;
  $('#trLists').innerHTML = a.id === b.id ? '<p class="muted">Choisis deux équipes différentes.</p>' : `${col(a,b)}<div style="height:12px"></div>${col(b,a)}`;
  document.querySelectorAll('.trp').forEach(cb => cb.onchange = previewTrade);
  previewTrade();
}
function tradeMoves(){ return [...document.querySelectorAll('.trp:checked')].map(cb => ({ playerId: Number(cb.dataset.p), toTeamId: Number(cb.dataset.to) })); }
// Aperçu local de la conformité après l'échange (mêmes règles que le serveur).
function previewTrade(){
  const moves = tradeMoves(); const el = $('#trPreview');
  if (!moves.length) { el.innerHTML = ''; return; }
  const ids = [Number($('#trA').value), Number($('#trB').value)];
  el.innerHTML = ids.map(id => {
    const t = team(id);
    let players = ['F','D','G'].flatMap(pos => t.positions[pos].players);
    const outIds = new Set(moves.filter(m => m.toTeamId !== id).map(m => m.playerId));
    players = players.filter(p => !outIds.has(p.id));
    for (const m of moves.filter(m => m.toTeamId === id)) players.push(findPlayer(m.playerId));
    const s = summarize(players);
    return `<div class="${s.issues.length ? 'issues' : 'okbox'}"><b>${esc(t.name)} après l'échange</b> : masse ${money(s.cap)} · ${s.n.F} A, ${s.n.D} D, ${s.n.G} G
      ${s.issues.length ? '<br>⚠ ' + s.issues.join('<br>⚠ ') : ' ✓'}</div>`;
  }).join('');
}
function summarize(players){
  const MIN = { F:9, D:4, G:2 }, MAX = { F:18, D:8, G:4 };
  const n = { F:0, D:0, G:0 }; let cap = 0; const issues = [];
  for (const pos of ['F','D','G']) {
    const list = players.filter(p => p.pos === pos); n[pos] = list.length;
    cap += list.map(p => p.aav || 0).sort((a,b) => b - a).slice(0, MIN[pos]).reduce((s,v) => s + v, 0);
    if (n[pos] < MIN[pos]) issues.push(`${POS_LABEL[pos]} : ${n[pos]} (min ${MIN[pos]})`);
    if (n[pos] > MAX[pos]) issues.push(`${POS_LABEL[pos]} : ${n[pos]} (max ${MAX[pos]})`);
  }
  if (cap > S.config.cap) issues.push(`plafond dépassé de ${moneyFull(cap - S.config.cap)}`);
  if (S.config.floor && cap < S.config.floor) issues.push(`sous le plancher de ${moneyFull(S.config.floor - cap)}`);
  return { n, cap, issues };
}
const doTrade = run(async () => {
  const moves = tradeMoves(); if (!moves.length) return toast('Coche au moins un joueur');
  if (!confirm(`Enregistrer l'échange (${moves.length} joueur(s)) ?`)) return;
  await api('/api/admin/trade', { moves, note: $('#trNote').value });
  toast('Échange enregistré'); await loadState(); vAdmin();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

// Rafraîchit les données quand on revient dans l'application.
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && !$('#sheet').classList.contains('open')) refresh().catch(() => {}); });

boot();
